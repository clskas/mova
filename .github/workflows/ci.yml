name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/shared/package-lock.json
      - run: npm ci
        working-directory: packages/shared
      - run: npm run build
        working-directory: packages/shared
      - run: npm test
        working-directory: packages/shared

  services:
    runs-on: ubuntu-latest
    needs: shared
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - ride-service
          - payment-service
          - driver-service
          - notification-service
          - admin-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build shared package
        run: |
          cd packages/shared && npm ci && npm run build
      - name: Install and build ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          npm install
          if [ -f prisma/schema.prisma ]; then npx prisma generate; fi
          npm run build
      - name: Unit tests
        run: |
          cd services/${{ matrix.service }}
          npm test -- --passWithNoTests
      - name: E2E tests (gateway only)
        if: matrix.service == 'api-gateway'
        run: |
          cd services/api-gateway
          npm run test:e2e -- --passWithNoTests

  clients:
    runs-on: ubuntu-latest
    needs: shared
    strategy:
      matrix:
        client: [web, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.client }}/package-lock.json
      - name: Install and build ${{ matrix.client }}
        run: |
          cd ${{ matrix.client }}
          npm ci
          npm run build
      - name: Lint ${{ matrix.client }}
        run: |
          cd ${{ matrix.client }}
          npm run lint
