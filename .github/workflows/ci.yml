name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/shared/package-lock.json
      - run: npm ci --no-workspaces
        working-directory: packages/shared
      - run: npm run build
        working-directory: packages/shared
      - run: npm test
        working-directory: packages/shared

  services:
    runs-on: ubuntu-latest
    needs: shared
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - ride-service
          - payment-service
          - driver-service
          - notification-service
          - admin-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build shared package
        run: |
          cd packages/shared && npm ci --no-workspaces && npm run build
      - name: Install and build ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          npm install
          if [ -f prisma/schema.prisma ]; then npx prisma generate; fi
          npm run build
      - name: Unit tests
        run: |
          cd services/${{ matrix.service }}
          npm test -- --passWithNoTests
      - name: E2E tests (gateway only)
        if: matrix.service == 'api-gateway'
        run: |
          cd services/api-gateway
          npm run test:e2e -- --passWithNoTests

  clients:
    runs-on: ubuntu-latest
    needs: shared
    strategy:
      matrix:
        client: [web, admin, restaurant, rental-partner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.client }}/package-lock.json
      - name: Install and build ${{ matrix.client }}
        env:
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cd ${{ matrix.client }}
          npm ci
          npm run build
      - name: Lint ${{ matrix.client }}
        run: |
          cd ${{ matrix.client }}
          if ! npm run | grep -qE '^  lint'; then
            echo "No lint script for ${{ matrix.client }} — skip"
            exit 0
          fi
          # next lint prompts interactively when ESLint is not configured — skip in that case.
          if [ ! -f .eslintrc.json ] && [ ! -f .eslintrc.js ] && [ ! -f eslint.config.mjs ] && [ ! -f eslint.config.js ]; then
            if ! grep -q '"eslintConfig"' package.json 2>/dev/null; then
              echo "No ESLint config for ${{ matrix.client }} — skip lint"
              exit 0
            fi
          fi
          npm run lint

  regression:
    name: Playwright regression
    runs-on: ubuntu-latest
    needs: [clients, services]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install browsers before the stack so Docker services are not idle
      # (and memory-pressured) during Playwright setup.
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start regression stack (Docker + admin/web)
        run: |
          chmod +x scripts/regression-ci.sh scripts/regression-ci-teardown.sh
          ./scripts/regression-ci.sh

      - name: Run Playwright regression (admin + web + health)
        working-directory: e2e
        env:
          CI: true
          E2E_REQUIRE_STACK: true
          ADMIN_BASE_URL: http://localhost:3002
          WEB_BASE_URL: http://localhost:3001
          GATEWAY_URL: http://127.0.0.1:3000
          ADMIN_PHONE: "+243900000001"
        run: |
          set +e
          npm run test:e2e:admin
          admin_ec=$?
          npm run test:e2e:web
          web_ec=$?
          if [ "$admin_ec" -ne 0 ] || [ "$web_ec" -ne 0 ]; then
            exit 1
          fi

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --tail 80 api-gateway auth-service payment-service ride-service || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Teardown regression stack
        if: always()
        run: ./scripts/regression-ci-teardown.sh

  mobile:
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter test
        working-directory: mobile
        run: flutter test

  smoke-scripts:
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lightweight smoke (no Docker)
        run: |
          chmod +x scripts/smoke-ci.sh
          ./scripts/smoke-ci.sh

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit (shared + gateway)
        run: |
          set -euo pipefail
          # Install-time npm audit summary is authoritative when the later audit
          # endpoint hangs/503s. Critical counts from install still fail the job.
          # Explicit `npm audit --audit-level=critical` is retried; high stays advisory.
          fail_if_install_has_critical() {
            local log_file="$1"
            local label="$2"
            if grep -Eiq '(^|[^0-9])[1-9][0-9]* critical' "$log_file"; then
              echo "::error::Critical vulnerabilities reported during install (${label})"
              return 1
            fi
            return 0
          }

          npm_audit_retry() {
            local level="$1"
            local label="$2"
            local soft_high="${3:-0}"
            local max_attempts=3
            if [ "$soft_high" = "1" ]; then
              max_attempts=2
            fi
            local attempt=1
            local out rc delay
            local per_try=90
            while [ "$attempt" -le "$max_attempts" ]; do
              set +e
              out="$(timeout "${per_try}s" npm audit --audit-level="$level" 2>&1)"
              rc=$?
              set -e
              printf '%s\n' "$out"
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if [ "$rc" -eq 124 ] || printf '%s' "$out" | grep -qiE '503|Service Unavailable|ECONNRESET|ETIMEDOUT|ENOTFOUND|audit endpoint returned an error'; then
                delay=$((attempt * 10))
                echo "::warning::npm audit ${level} transient registry failure (${label}, attempt ${attempt}/${max_attempts}, rc=${rc}); retry in ${delay}s"
                sleep "$delay"
                attempt=$((attempt + 1))
                continue
              fi
              if [ "$soft_high" = "1" ]; then
                echo "::warning::npm audit high findings in ${label}"
                return 0
              fi
              # Real critical findings from a successful audit response
              return "$rc"
            done
            if [ "$soft_high" = "1" ]; then
              echo "::warning::npm audit high skipped after ${max_attempts} transient failures (${label}); not blocking CI"
              return 0
            fi
            # Critical endpoint unavailable — rely on install-time summary already checked.
            echo "::warning::npm audit critical endpoint unavailable after ${max_attempts} attempts (${label}); install-time summary had no criticals"
            return 0
          }

          shared_log="$(mktemp)"
          cd packages/shared
          npm ci --no-workspaces 2>&1 | tee "$shared_log"
          fail_if_install_has_critical "$shared_log" packages/shared
          npm_audit_retry critical packages/shared
          npm_audit_retry high packages/shared 1

          gateway_log="$(mktemp)"
          cd ../../services/api-gateway
          npm install 2>&1 | tee "$gateway_log"
          fail_if_install_has_critical "$gateway_log" api-gateway
          npm_audit_retry critical api-gateway
          npm_audit_retry high api-gateway 1
      - name: Guard against committed secrets
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.local$|credentials\.json$|upload-keystore\.jks$' ; then
            echo "::error::Secret-like files are tracked by git"
            exit 1
          fi
          echo "No tracked .env / keystore / credentials.json"

  codeql:
    runs-on: ubuntu-latest
    # GHAS / code scanning may be disabled on the org — do not block Deploy.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true
