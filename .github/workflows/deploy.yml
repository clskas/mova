name: Deploy

on:
  workflow_run:
    # Ordered chain: CI → Build and Push → Deploy → Smoke → Mobile Release
    workflows: ["Build and Push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      skip_backup:
        description: Skip DB backup (tests / emergency only — never for prod migrations)
        required: false
        type: boolean
        default: false
      staging_only:
        description: Pre-production only — deploy + check staging, never touch production
        required: false
        type: boolean
        default: false
      commit:
        description: Commit SHA to deploy (default = the workflow ref). Must exist on afri-soft-com/mova.
        required: false
        type: string
        default: ''
      skip_staging:
        description: Emergency rollback only — skip the staging gate (the commit was already live)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  # Render builds from the afri-soft-com/mova mirror. Push the merged commit there
  # first (deploy key AFRI_SOFT_DEPLOY_KEY, write access to that repo only).
  # Without the key: manual `git push afri-soft origin/main:refs/heads/main`, as before.
  # Manual runs (rollback, redeploy) deploy commits that are already mirrored: no push.
  mirror:
    if: >
      github.repository != 'afri-soft-com/mova' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Push main to afri-soft-com/mova
        env:
          AFRI_SOFT_DEPLOY_KEY: ${{ secrets.AFRI_SOFT_DEPLOY_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${AFRI_SOFT_DEPLOY_KEY:-}" ]; then
            echo "::notice::AFRI_SOFT_DEPLOY_KEY unset — push main to afri-soft by hand (git push afri-soft origin/main:refs/heads/main)."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AFRI_SOFT_DEPLOY_KEY" > ~/.ssh/afri_soft && chmod 600 ~/.ssh/afri_soft
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/afri_soft -o IdentitiesOnly=yes -o BatchMode=yes"
          # Fast-forward only: if afri-soft has commits main does not, stop and say so.
          if git push git@github.com:afri-soft-com/mova.git "$SHA:refs/heads/main"; then
            echo "afri-soft-com/mova main → $SHA"
          else
            git fetch -q git@github.com:afri-soft-com/mova.git main
            if git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
              echo "afri-soft already contains $SHA (pushed by hand) — OK"
            else
              echo "::error::afri-soft-com/mova main has diverged from clskas/mova main — fix by hand, then re-run Deploy."
              exit 1
            fi
          fi

  # Pre-production gate: the same commit is deployed to the mova-stg-* stack
  # (mocked SMS / Mobile Money, own databases) and must pass the strict smoke
  # before production is touched. Skipped until config/render-services.staging.json exists.
  deploy-staging:
    needs: mirror
    if: >
      !cancelled() && needs.mirror.result != 'failure' &&
      github.repository != 'afri-soft-com/mova' &&
      !(github.event_name == 'workflow_dispatch' && inputs.skip_staging) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Staging configured?
        id: cfg
        run: |
          if [ -f config/render-services.staging.json ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "gateway=$(jq -r '.gatewayUrl' config/render-services.staging.json)" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No config/render-services.staging.json — staging gate skipped (run Render Provision Staging)."
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to staging
        if: steps.cfg.outputs.active == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICES_FILE: config/render-services.staging.json
          RENDER_SERVICE_IDS: ''
        run: bash scripts/render-deploy.sh "${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}"

      - name: Wait for every staging service
        if: steps.cfg.outputs.active == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICES_FILE: config/render-services.staging.json
        run: bash scripts/render-guard.sh verify "${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}"

      - name: Strict smoke test (staging)
        if: steps.cfg.outputs.active == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            if SMOKE_STRICT=true GATEWAY_URL="${{ steps.cfg.outputs.gateway }}" bash scripts/smoke-test.sh; then
              exit 0
            fi
            echo "Staging smoke attempt $attempt failed — retry in 30s"
            sleep 30
          done
          echo "::error::Staging failed the strict smoke — production NOT deployed."
          exit 1

      # Real passenger journey (mock OTP): sign-in, profile, estimate, create +
      # cancel a ride, wallet, notifications, history — across all services.
      - name: Passenger journey (staging)
        if: steps.cfg.outputs.active == 'true'
        run: |
          for attempt in 1 2 3; do
            if GATEWAY_URL="${{ steps.cfg.outputs.gateway }}" bash scripts/staging-journey.sh; then
              exit 0
            fi
            echo "Journey attempt $attempt failed — retry in 30s"
            sleep 30
          done
          echo "::error::Staging passenger journey failed — production NOT deployed."
          exit 1

  deploy-render:
    needs: deploy-staging
    # Deploy from clskas/mova only (same commit SHA pushed to afri-soft for Render).
    # Staging skipped (rollback / not configured) is fine; staging failed is not.
    if: >
      !cancelled() && needs.deploy-staging.result != 'failure' &&
      github.repository != 'afri-soft-com/mova' &&
      !(github.event_name == 'workflow_dispatch' && inputs.staging_only) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Render mova-db-auth is PostgreSQL 18; Ubuntu noble's postgresql-client is 16.
      # pg_dump refuses to dump a newer major version, which previously failed Deploy.
      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq ca-certificates
          if sudo apt-get install -y postgresql-common \
            && [ -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ] \
            && sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y \
            && sudo apt-get install -y postgresql-client-18; then
            echo "Installed postgresql-client-18"
          else
            echo "::warning::postgresql-client-18 unavailable — falling back to distro postgresql-client (dump is skipped on version mismatch)"
            sudo apt-get install -y postgresql-client
          fi
          pg_dump --version || true
          ls /usr/lib/postgresql/*/bin/pg_dump 2>/dev/null || true

      # Pre-deploy pg_dump. Production is Render Postgres mova-db-auth
      # (dpg-daa5u3on74is739uken0-a): mova_auth, mova_rides, mova_payments,
      # mova_drivers, mova_notifications.
      # Required GitHub secrets (Render External URLs, host *.render.com — not Neon):
      #   DATABASE_URL_AUTH          → …/mova_auth
      #   DATABASE_URL_RIDES         → …/mova_rides
      #   DATABASE_URL_PAYMENTS      → …/mova_payments
      #   DATABASE_URL_DRIVERS       → …/mova_drivers
      #   DATABASE_URL_NOTIFICATIONS → …/mova_notifications
      # Internal hostnames (dpg-…-a, no domain) are unreachable from GitHub.
      # Neon (*.neon.tech) and pg_dump/server version mismatch are skipped with a
      # warning so deploy of web/auth still proceeds.
      - name: Backup databases before deploy (required before migrations)
        env:
          DATABASE_URL_AUTH: ${{ secrets.DATABASE_URL_AUTH }}
          DATABASE_URL_RIDES: ${{ secrets.DATABASE_URL_RIDES }}
          DATABASE_URL_PAYMENTS: ${{ secrets.DATABASE_URL_PAYMENTS }}
          DATABASE_URL_DRIVERS: ${{ secrets.DATABASE_URL_DRIVERS }}
          DATABASE_URL_NOTIFICATIONS: ${{ secrets.DATABASE_URL_NOTIFICATIONS }}
          BACKUP_RETENTION_DAYS: '14'
          MOVA_SKIP_BACKUP: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_backup) && '1' || '' }}
        run: |
          set -euo pipefail
          chmod +x scripts/backup-db.sh
          if [ "${MOVA_SKIP_BACKUP:-}" = "1" ]; then
            echo "::warning::MOVA_SKIP_BACKUP=1 — skipping pg_dump (tests/emergency only)"
            exit 0
          fi
          if [ -z "${DATABASE_URL_AUTH:-}" ] && [ -z "${DATABASE_URL_RIDES:-}" ]; then
            echo "::error::DATABASE_URL_AUTH / DATABASE_URL_RIDES secrets required for production deploy backup."
            echo "Configure DATABASE_URL_* secrets (Render External URLs), or use workflow_dispatch with skip_backup=true for non-prod."
            exit 1
          fi
          # Host policy in scripts/backup-db.sh:
          #   *.render.com → pg_dump; *.neon.tech / version mismatch → skip (do not fail deploy).
          ./scripts/backup-db.sh

      - name: Upload DB backup artifact
        if: success()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: db-backups-${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
          path: backups/
          retention-days: 14
          if-no-files-found: ignore

      - name: Resolve Render service IDs
        id: render
        run: |
          # config/render-services.json is the source of truth (includes restaurant,
          # rental-partner, admin-web). A stale RENDER_SERVICE_IDS secret previously
          # deployed only the original 8 API/web services and left portals on old images.
          if [ -f config/render-services.json ]; then
            ids=$(jq -r '
              [
                .services["mova-auth"].id // empty,
                .services["mova-ride"].id // empty,
                .services["mova-payment"].id // empty,
                .services["mova-driver"].id // empty,
                .services["mova-notification"].id // empty,
                .services["mova-admin"].id // empty,
                .services["mova-gateway"].id // empty,
                .services["mova-web"].id // empty,
                .services["mova-admin-web"].id // empty,
                .services["mova-restaurant"].id // empty,
                .services["mova-rental-partner"].id // empty
              ] | map(select(length > 0)) | join(" ")
            ' config/render-services.json)
            echo "ids=$ids" >> "$GITHUB_OUTPUT"
            echo "gateway=$(jq -r '.gatewayServiceId // empty' config/render-services.json)" >> "$GITHUB_OUTPUT"
            echo "Using service IDs from config/render-services.json"
            echo "services=$ids"
          elif [ -n "${{ secrets.RENDER_SERVICE_IDS }}" ]; then
            echo "ids=${{ secrets.RENDER_SERVICE_IDS }}" >> "$GITHUB_OUTPUT"
            echo "gateway=${{ secrets.GATEWAY_RENDER_SERVICE_ID }}" >> "$GITHUB_OUTPUT"
          fi

      # Wake Render Postgres + apply pending migrations before containers restart.
      # Reduces ride crash loops (FATAL / P1017) when migrate races traffic on cold start.
      - name: Wake Postgres and pre-migrate (rides + auth)
        env:
          DATABASE_URL_AUTH: ${{ secrets.DATABASE_URL_AUTH }}
          DATABASE_URL_RIDES: ${{ secrets.DATABASE_URL_RIDES }}
        run: |
          set -euo pipefail
          wake() {
            local label="$1" url="$2"
            if [ -z "$url" ]; then
              echo "::warning::skip wake $label — secret unset"
              return 0
            fi
            echo "=== wake $label ==="
            for i in 1 2 3 4 5 6 7 8; do
              if psql "$url" -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null 2>&1; then
                echo "$label ready (attempt $i)"
                return 0
              fi
              echo "WARN: $label not ready (attempt $i) — sleep $((i * 3))s"
              sleep $((i * 3))
            done
            echo "::warning::$label still cold after wake attempts — container entrypoint will retry"
          }
          wake auth "${DATABASE_URL_AUTH:-}"
          wake rides "${DATABASE_URL_RIDES:-}"

          migrate_one() {
            local label="$1" url="$2" dir="$3"
            if [ -z "$url" ]; then
              echo "::warning::skip pre-migrate $label — secret unset"
              return 0
            fi
            echo "=== pre-migrate $label ==="
            (
              cd "$dir"
              export DATABASE_URL="$url"
              export PRISMA_MIGRATE_SKIP_SEED=1
              export SKIP_DEMO_SEED=true
              export RUN_SEED=false
              npx --yes prisma@5.22.0 migrate deploy
            ) || echo "::warning::pre-migrate $label failed — container start will retry"
          }
          migrate_one auth "${DATABASE_URL_AUTH:-}" services/auth-service
          migrate_one rides "${DATABASE_URL_RIDES:-}" services/ride-service

      - name: Snapshot live Render deploys (rollback target)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: bash scripts/render-guard.sh snapshot render-snapshot.json

      - name: Trigger Render deploy (API + web + portals)
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_IDS: ${{ steps.render.outputs.ids }}
        run: |
          chmod +x scripts/render-deploy.sh
          ./scripts/render-deploy.sh "${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}"

      - name: Note — migrations run on container start
        run: |
          echo "CI already woke Postgres + pre-migrated auth/rides when secrets are set."
          echo "Containers still run scripts/migrate-with-backup.sh as a safety net (usually no-op)."
          echo "prisma db seed is FORBIDDEN on production — never create +2439000000xx demo users."

      # Every service must run the new commit — not only the gateway — then the
      # strict smoke must pass. Otherwise the pre-deploy versions are restored.
      - name: Wait for every Render service
        id: verify
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: bash scripts/render-guard.sh verify "${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}"

      - name: Strict smoke test (production)
        id: smoke
        run: |
          set -euo pipefail
          GATEWAY_URL="${{ vars.GATEWAY_URL }}"
          if [ -z "$GATEWAY_URL" ] && [ -f config/render-services.json ]; then
            GATEWAY_URL=$(jq -r '.gatewayUrl // empty' config/render-services.json)
          fi
          GATEWAY_URL="${GATEWAY_URL:-${{ secrets.SMOKE_API_URL }}}"
          # Services restart one by one: give the stack a few tries before calling it broken.
          for attempt in 1 2 3 4 5; do
            if SMOKE_STRICT=true GATEWAY_URL="$GATEWAY_URL" bash scripts/smoke-test.sh; then
              exit 0
            fi
            echo "Smoke attempt $attempt failed — retry in 30s"
            sleep 30
          done
          exit 1

      - name: Roll back to the pre-deploy versions
        if: ${{ failure() && steps.trigger.outcome == 'success' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          bash scripts/render-guard.sh rollback render-snapshot.json
          echo "::error::Deploy of ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }} failed checks — production rolled back."

      - name: Upload Render snapshot
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: render-snapshot-${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
          path: render-snapshot.json
          if-no-files-found: ignore

  # AfriSoft Pay hub (Hetzner VPS, not Render). The CI key is pinned on the VPS to
  # deploy/afrisoft-pay/scripts/ci-deploy.sh (forced command): backup, build,
  # swap, /health check and automatic rollback. Inactive until the secret exists.
  deploy-hub:
    needs: deploy-render
    if: ${{ github.repository != 'afri-soft-com/mova' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Deploy payment hub
        env:
          HUB_DEPLOY_SSH_KEY: ${{ secrets.HUB_DEPLOY_SSH_KEY }}
          HUB_SSH_KNOWN_HOSTS: ${{ secrets.HUB_SSH_KNOWN_HOSTS }}
          HUB_HOST: ${{ vars.HUB_HOST || '178.104.82.66' }}
          SHA: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${HUB_DEPLOY_SSH_KEY:-}" ] || [ -z "${HUB_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::warning::HUB_DEPLOY_SSH_KEY / HUB_SSH_KNOWN_HOSTS not set — payment hub not deployed (see deploy/afrisoft-pay/README.md)"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HUB_DEPLOY_SSH_KEY" > ~/.ssh/hub && chmod 600 ~/.ssh/hub
          printf '%s\n' "$HUB_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar "$SHA" \
            | ssh -i ~/.ssh/hub -o BatchMode=yes -o ServerAliveInterval=30 "root@$HUB_HOST" "deploy $SHA"
          curl -sf -m 15 https://pay.afri-soft.com/health
