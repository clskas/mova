name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-render:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq

      - name: Backup databases before deploy
        env:
          DATABASE_URL_AUTH: ${{ secrets.DATABASE_URL_AUTH }}
          DATABASE_URL_RIDES: ${{ secrets.DATABASE_URL_RIDES }}
          DATABASE_URL_PAYMENTS: ${{ secrets.DATABASE_URL_PAYMENTS }}
          DATABASE_URL_DRIVERS: ${{ secrets.DATABASE_URL_DRIVERS }}
          DATABASE_URL_NOTIFICATIONS: ${{ secrets.DATABASE_URL_NOTIFICATIONS }}
          BACKUP_RETENTION_DAYS: '14'
        run: |
          chmod +x scripts/backup-db.sh
          if [ -z "$DATABASE_URL_AUTH" ] && [ -z "$DATABASE_URL_RIDES" ]; then
            echo "DATABASE_URL_* secrets not set — skip pg_dump (configure secrets for prod backups)"
          else
            ./scripts/backup-db.sh
          fi

      - name: Upload DB backup artifact
        if: success()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: db-backups-${{ github.event.workflow_run.head_sha || github.sha }}
          path: backups/
          retention-days: 14
          if-no-files-found: ignore

      - name: Resolve Render service IDs
        id: render
        run: |
          if [ -n "${{ secrets.RENDER_SERVICE_IDS }}" ]; then
            echo "ids=${{ secrets.RENDER_SERVICE_IDS }}" >> "$GITHUB_OUTPUT"
            echo "gateway=${{ secrets.GATEWAY_RENDER_SERVICE_ID }}" >> "$GITHUB_OUTPUT"
          elif [ -f config/render-services.json ]; then
            gateway=$(jq -r '.gatewayServiceId // empty' config/render-services.json)
            echo "gateway=$gateway" >> "$GITHUB_OUTPUT"
            echo "Using service IDs from config/render-services.json (ordered deploy)"
          fi

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_IDS: ${{ steps.render.outputs.ids }}
        run: |
          chmod +x scripts/render-deploy.sh
          ./scripts/render-deploy.sh "${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Wait for Render deploy (gateway)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GATEWAY_RENDER_SERVICE_ID: ${{ steps.render.outputs.gateway }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$GATEWAY_RENDER_SERVICE_ID" ]; then
            echo "RENDER_API_KEY or GATEWAY_RENDER_SERVICE_ID not set — skip wait"
            sleep 30
            exit 0
          fi
          for i in $(seq 1 45); do
            status=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/${GATEWAY_RENDER_SERVICE_ID}/deploys?limit=1" \
              | jq -r '.[0].status // .[0].deploy.status // "unknown"')
            echo "Gateway deploy status: $status (attempt $i)"
            if [ "$status" = "live" ]; then exit 0; fi
            if [ "$status" = "build_failed" ] || [ "$status" = "update_failed" ]; then
              echo "Deploy failed on Render"
              exit 1
            fi
            sleep 20
          done
          echo "Timeout waiting for Render deploy"
