name: Mobile Release

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ['Smoke Tests Production']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_ios_testflight:
        description: "iOS seulement — publier l'IPA sur TestFlight (Play internal est toujours tenté après AAB si secret Play présent)"
        required: false
        type: boolean
        default: false
      build_ios:
        description: Construire IPA (macOS + certificats Apple requis)
        required: false
        type: boolean
        default: false
      build_apks:
        description: Aussi construire les APK (install direct) — non requis pour Play
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: stable
  # Défauts production (Render). Les secrets peuvent surcharger, mais le job
  # "Resolve production API URLs" rejette les IP LAN / localhost.
  DEFAULT_PROD_API_URL: https://mova-gateway.onrender.com/api
  DEFAULT_PROD_WS_URL: https://mova-gateway.onrender.com

jobs:
  build-android:
    name: Build Android (AAB)
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve production API URLs
        id: urls
        env:
          SECRET_API: ${{ secrets.PROD_API_URL }}
          SECRET_WS: ${{ secrets.PROD_WS_URL }}
        run: |
          set -euo pipefail
          API="${SECRET_API:-$DEFAULT_PROD_API_URL}"
          WS="${SECRET_WS:-$DEFAULT_PROD_WS_URL}"
          looks_dev() {
            local u="$1"
            echo "$u" | grep -qiE \
              '(localhost|127\.0\.0\.1|10\.0\.2\.2|:3000|://10\.|://192\.168\.|://172\.(1[6-9]|2[0-9]|3[0-1])\.)'
          }
          if looks_dev "$API" || looks_dev "$WS" || [[ "$API" != https://* ]] || [[ "$WS" != https://* ]]; then
            echo "::warning::PROD_API_URL/PROD_WS_URL invalides ou LAN — forçage Render production"
            API="$DEFAULT_PROD_API_URL"
            WS="$DEFAULT_PROD_WS_URL"
          fi
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "ws=$WS" >> "$GITHUB_OUTPUT"
          echo "Using API_URL=$API"
          echo "Using WS_URL=$WS"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # storeFile is resolved relative to mobile/android/app/ (Gradle app module)
            KEYSTORE_PATH="mobile/android/app/upload-keystore.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            {
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "storeFile=upload-keystore.jks"
            } > mobile/android/key.properties
            echo "Keystore release configuré ($(wc -c < "$KEYSTORE_PATH") bytes)"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 absent — build signé avec clé debug (non publiable sur Play Store)"
          fi

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build passenger AAB
        working-directory: mobile
        run: |
          flutter build appbundle --release \
            --flavor passenger \
            -t lib/main_passenger.dart \
            --dart-define=API_URL=${{ steps.urls.outputs.api }} \
            --dart-define=WS_URL=${{ steps.urls.outputs.ws }}

      - name: Build driver AAB
        working-directory: mobile
        run: |
          flutter build appbundle --release \
            --flavor driver \
            -t lib/main_driver.dart \
            --dart-define=API_URL=${{ steps.urls.outputs.api }} \
            --dart-define=WS_URL=${{ steps.urls.outputs.ws }}

      # Upload AABs before optional APKs so Play upload is not blocked by APK OOM/cancel.
      - name: Upload passenger AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-passenger-aab
          path: mobile/build/app/outputs/bundle/passengerRelease/app-passenger-release.aab
          retention-days: 30

      - name: Upload driver AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-driver-aab
          path: mobile/build/app/outputs/bundle/driverRelease/app-driver-release.aab
          retention-days: 30

      - name: Build passenger APK (install direct)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apks == true }}
        continue-on-error: true
        working-directory: mobile
        run: |
          flutter build apk --release \
            --flavor passenger \
            -t lib/main_passenger.dart \
            --dart-define=API_URL=${{ steps.urls.outputs.api }} \
            --dart-define=WS_URL=${{ steps.urls.outputs.ws }}

      - name: Build driver APK (install direct)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apks == true }}
        continue-on-error: true
        working-directory: mobile
        run: |
          flutter build apk --release \
            --flavor driver \
            -t lib/main_driver.dart \
            --dart-define=API_URL=${{ steps.urls.outputs.api }} \
            --dart-define=WS_URL=${{ steps.urls.outputs.ws }}

      - name: Upload passenger APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apks == true }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mova-passenger-apk
          path: mobile/build/app/outputs/flutter-apk/app-passenger-release.apk
          retention-days: 30

      - name: Upload driver APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apks == true }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mova-driver-apk
          path: mobile/build/app/outputs/flutter-apk/app-driver-release.apk
          retention-days: 30

  upload-android:
    name: Upload Play Store (internal)
    needs: build-android
    # Toujours après un build AAB réussi (smoke→main, tag v*, workflow_dispatch).
    # Skip uniquement si aucun secret Play n'est configuré. Gate env: production-mobile.
    if: needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    environment: production-mobile
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile/android

      - name: Download passenger AAB
        uses: actions/download-artifact@v4
        with:
          name: mova-passenger-aab
          path: mobile/build/app/outputs/bundle/passengerRelease/

      - name: Download driver AAB
        uses: actions/download-artifact@v4
        with:
          name: mova-driver-aab
          path: mobile/build/app/outputs/bundle/driverRelease/

      - name: Verify AAB artifacts
        run: |
          set -e
          PASSENGER_AAB=mobile/build/app/outputs/bundle/passengerRelease/app-passenger-release.aab
          DRIVER_AAB=mobile/build/app/outputs/bundle/driverRelease/app-driver-release.aab
          ls -la "$PASSENGER_AAB" "$DRIVER_AAB"
          test -s "$PASSENGER_AAB"
          test -s "$DRIVER_AAB"

      - name: Upload to Play Console internal track (Fastlane)
        working-directory: mobile/android
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -e
          # Accepted secrets (first match wins):
          # - PLAY_STORE_JSON_KEY: service-account JSON encoded base64
          # - PLAY_SERVICE_ACCOUNT_JSON: raw JSON or base64
          # - PLAY_STORE_JSON: raw JSON
          if [ -n "$PLAY_STORE_JSON_KEY" ]; then
            echo "$PLAY_STORE_JSON_KEY" | base64 -d > /tmp/play-store-key.json
          elif [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            if printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | head -c 1 | grep -q '{'; then
              printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > /tmp/play-store-key.json
            else
              echo "$PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > /tmp/play-store-key.json
            fi
          elif [ -n "$PLAY_STORE_JSON" ]; then
            printf '%s' "$PLAY_STORE_JSON" > /tmp/play-store-key.json
          else
            echo "::notice::Secrets Play absents (PLAY_STORE_JSON_KEY / PLAY_SERVICE_ACCOUNT_JSON / PLAY_STORE_JSON). AAB en artefacts Actions — upload ignoré."
            exit 0
          fi
          if ! head -c 1 /tmp/play-store-key.json | grep -q '{'; then
            echo "::error::Clé Play Store invalide (JSON attendu après décodage)."
            exit 1
          fi
          export PLAY_STORE_JSON_KEY_PATH=/tmp/play-store-key.json
          echo "Upload Play internal: cd.mova.mova.passenger + cd.mova.mova.driver"
          bundle exec fastlane deploy_internal


  build-ios:
    name: Build iOS (IPA)
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_ios == true)
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      ipa_built: ${{ steps.build_ipa.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve production API URLs
        id: urls
        env:
          SECRET_API: ${{ secrets.PROD_API_URL }}
          SECRET_WS: ${{ secrets.PROD_WS_URL }}
        run: |
          set -euo pipefail
          API="${SECRET_API:-$DEFAULT_PROD_API_URL}"
          WS="${SECRET_WS:-$DEFAULT_PROD_WS_URL}"
          looks_dev() {
            local u="$1"
            echo "$u" | grep -qiE \
              '(localhost|127\.0\.0\.1|10\.0\.2\.2|:3000|://10\.|://192\.168\.|://172\.(1[6-9]|2[0-9]|3[0-1])\.)'
          }
          if looks_dev "$API" || looks_dev "$WS" || [[ "$API" != https://* ]] || [[ "$WS" != https://* ]]; then
            echo "::warning::PROD_API_URL/PROD_WS_URL invalides ou LAN — forçage Render production"
            API="$DEFAULT_PROD_API_URL"
            WS="$DEFAULT_PROD_WS_URL"
          fi
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "ws=$WS" >> "$GITHUB_OUTPUT"
          echo "Using API_URL=$API"
          echo "Using WS_URL=$WS"

      - name: Check iOS credentials
        id: ios_creds
        run: |
          if [ -z "${{ secrets.MATCH_PASSWORD }}" ] || [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY }}" ]; then
            echo "::notice::Certificats iOS non configurés — voir docs/cicd.md"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.ios_creds.outputs.available == 'true'
        with:
          channel: stable
          cache: true

      - name: Install CocoaPods
        if: steps.ios_creds.outputs.available == 'true'
        working-directory: mobile/ios
        run: pod install

      - name: Import signing certificates (match)
        if: steps.ios_creds.outputs.available == 'true'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          cd mobile/ios
          bundle install
          bundle exec fastlane match appstore --readonly

      - name: Build passenger IPA
        id: build_ipa
        if: steps.ios_creds.outputs.available == 'true'
        working-directory: mobile
        run: |
          flutter build ipa --release \
            -t lib/main_passenger.dart \
            --dart-define=API_URL=${{ steps.urls.outputs.api }} \
            --dart-define=WS_URL=${{ steps.urls.outputs.ws }}

      - name: Upload IPA artifact
        if: steps.ios_creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mova-passenger-ipa
          path: mobile/build/ios/ipa/*.ipa
          retention-days: 30

  upload-ios:
    name: Upload TestFlight
    needs: build-ios
    if: >
      needs.build-ios.outputs.ipa_built == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.upload_ios_testflight == true))
    runs-on: macos-latest
    environment: production-mobile
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile/ios

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: mova-passenger-ipa
          path: mobile/build/ios/ipa/

      - name: Upload to TestFlight
        working-directory: mobile/ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "::notice::APP_STORE_CONNECT_API_KEY non configuré — publication TestFlight ignorée."
            exit 0
          fi
          bundle exec fastlane beta
