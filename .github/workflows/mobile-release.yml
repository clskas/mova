name: Mobile Release

# Sérialise les runs : des uploads Play parallèles font expirer l'Edit API (« This edit has expired »).
concurrency:
  group: mobile-release
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ['Smoke Tests Production']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_ios_testflight:
        description: "iOS — publier les IPA (Senga + Senga Driver) sur TestFlight / ASC"
        required: false
        type: boolean
        default: false
      submit_ios_app_store:
        description: "iOS — après TestFlight, soumettre Senga + Senga Driver pour review App Store (production). Métadonnées ASC requises."
        required: false
        type: boolean
        default: false
      build_ios:
        description: Construire IPA passager + chauffeur (macOS + certificats Apple requis)
        required: false
        type: boolean
        default: false
      build_apks:
        description: Aussi construire les APK (install direct) — non requis pour Play
        required: false
        type: boolean
        default: false
      promote_to_production:
        description: "Après l'upload internal, promouvoir vers production (les chauffeurs ne verront plus « Interne »). Ne cocher que si la fiche store / questionnaire contenu est complet."
        required: false
        type: boolean
        default: false
      promote_only:
        description: "Promouvoir seulement internal→production (pas de rebuild AAB). À utiliser quand versionCode est déjà sur internal."
        required: false
        type: boolean
        default: false
      asc_submit_only:
        description: "iOS — soumettre pour review App Store sans rebuild (IPA déjà sur TestFlight). Utilise scripts/asc_update_review_and_submit.py."
        required: false
        type: boolean
        default: false
      asc_build_number:
        description: "iOS — CFBundleVersion / build number à préférer (ex. 119). Vide = dernier build VALID."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

env:
  # Keep in sync with CI mobile job — livekit_client 2.5.4 (16 KB noise) on Flutter 3.32.6.
  FLUTTER_VERSION: '3.32.6'
  # Défauts production (domaine custom). Les secrets peuvent surcharger, mais le job
  # "Resolve production API URLs" rejette les IP LAN / localhost.
  DEFAULT_PROD_API_URL: https://api.afri-soft.com/api
  DEFAULT_PROD_WS_URL: https://api.afri-soft.com

jobs:
  build-android:
    name: Build Android (AAB)
    # On manual dispatch: skip Android for iOS-only runs (build_ios / TestFlight without Play promote).
    if: >
      github.repository != 'afri-soft-com/mova' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.promote_only != true &&
        inputs.asc_submit_only != true &&
        (inputs.promote_to_production == true ||
         (inputs.build_ios != true && inputs.upload_ios_testflight != true && inputs.submit_ios_app_store != true))))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.playver.outputs.name }}
      version_code: ${{ steps.playver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve production API URLs
        id: urls
        env:
          SECRET_API: ${{ secrets.PROD_API_URL }}
          SECRET_WS: ${{ secrets.PROD_WS_URL }}
        run: |
          set -euo pipefail
          API="${SECRET_API:-$DEFAULT_PROD_API_URL}"
          WS="${SECRET_WS:-$DEFAULT_PROD_WS_URL}"
          looks_dev() {
            local u="$1"
            echo "$u" | grep -qiE \
              '(localhost|127\.0\.0\.1|10\.0\.2\.2|:3000|://10\.|://192\.168\.|://172\.(1[6-9]|2[0-9]|3[0-1])\.)'
          }
          if looks_dev "$API" || looks_dev "$WS" || [[ "$API" != https://* ]] || [[ "$WS" != https://* ]]; then
            echo "::warning::PROD_API_URL/PROD_WS_URL invalides ou LAN — forçage API production"
            API="$DEFAULT_PROD_API_URL"
            WS="$DEFAULT_PROD_WS_URL"
          fi
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "ws=$WS" >> "$GITHUB_OUTPUT"
          echo "Using API_URL=$API"
          echo "Using WS_URL=$WS"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # storeFile is resolved relative to mobile/android/app/ (Gradle app module)
            KEYSTORE_PATH="mobile/android/app/upload-keystore.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            {
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "storeFile=upload-keystore.jks"
            } > mobile/android/key.properties
            echo "Keystore release configuré ($(wc -c < "$KEYSTORE_PATH") bytes)"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 absent — build signé avec clé debug (non publiable sur Play Store)"
          fi

      - name: Write google-services.json (FCM)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          OUT="mobile/android/app/google-services.json"
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$OUT"
            test -s "$OUT"
            echo "google-services.json écrit ($(wc -c < "$OUT") bytes) — FCM activé"
          else
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 absent — build sans FCM (SMS secours chauffeur). Voir docs/FIREBASE_SENGA_SETUP.md"
          fi

      - name: Free disk space
        run: |
          set -euo pipefail
          # Run 34234263647 cancelled on the second AAB; retry 34237959757 died
          # with "No space left on device" while unzipping NDK (an 8G swapfile
          # on the same disk made it worse). Drop unused hosted-runner toolchains.
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
            /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h /

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Resolve Play version code
        id: playver
        run: |
          set -euo pipefail
          # Floor must stay above the highest versionCode already accepted by Play
          # (123 used; bump when uploads fail with "already been used").
          FLOOR=157
          PUBSPEC_LINE=$(grep -E '^version:' mobile/pubspec.yaml | head -1)
          PUBSPEC_NAME=$(printf '%s' "$PUBSPEC_LINE" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          PUBSPEC_CODE=$(printf '%s' "$PUBSPEC_LINE" | sed -E 's/.*\+([0-9]+).*/\1/')
          CODE="${{ github.run_number }}"
          if [ "$CODE" -lt "$FLOOR" ]; then CODE="$FLOOR"; fi
          if [ -n "$PUBSPEC_CODE" ] && [ "$PUBSPEC_CODE" -gt "$CODE" ]; then CODE="$PUBSPEC_CODE"; fi
          echo "name=${PUBSPEC_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Play versionName=$PUBSPEC_NAME versionCode=$CODE (pubspec +${PUBSPEC_CODE:-?}; run_number=${{ github.run_number }}; floor=$FLOOR)"

      - name: Build passenger AAB
        working-directory: mobile
        run: |
          # Always the Web OAuth client (never an Android client ID from a mis-set secret).
          WEB_CLIENT="58917716638-rbgibno8pdvlud8dd00pdfjdv3q1dh4k.apps.googleusercontent.com"
          flutter build appbundle --release \
            --flavor passenger \
            -t lib/main_passenger.dart \
            --build-name=${{ steps.playver.outputs.name }} \
            --build-number=${{ steps.playver.outputs.code }} \
            --dart-define=API_URL=${{ steps.urls.outputs.api }} \
            --dart-define=WS_URL=${{ steps.urls.outputs.ws }} \
            --dart-define=APP_BUILD=${{ steps.playver.outputs.code }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$WEB_CLIENT

      - name: Verify passenger AAB flavor
        run: bash mobile/tool/verify_aab_flavor.sh passenger mobile/build/app/outputs/bundle/passengerRelease/app-passenger-release.aab

      # Save passenger AAB before the driver build so a later cancel still leaves an artifact.
      - name: Upload passenger AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-passenger-aab
          path: mobile/build/app/outputs/bundle/passengerRelease/app-passenger-release.aab
          retention-days: 30

      - name: Stop Gradle + clean before driver AAB
        run: |
          set -euo pipefail
          (cd mobile/android && ./gradlew --stop) || true
          # Avoid rare Flutter kernel reuse across sequential flavor builds.
          (cd mobile && flutter clean && flutter pub get)
          df -h /
          free -h

      - name: Build driver AAB
        working-directory: mobile
        run: |
          WEB_CLIENT="58917716638-rbgibno8pdvlud8dd00pdfjdv3q1dh4k.apps.googleusercontent.com"
          flutter build appbundle --release \
            --flavor driver \
            -t lib/main_driver.dart \
            --build-name=${{ steps.playver.outputs.name }} \
            --build-number=${{ steps.playver.outputs.code }} \
            --dart-define=API_URL=${{ steps.urls.outputs.api }} \
            --dart-define=WS_URL=${{ steps.urls.outputs.ws }} \
            --dart-define=APP_BUILD=${{ steps.playver.outputs.code }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$WEB_CLIENT

      - name: Verify driver AAB flavor
        run: bash mobile/tool/verify_aab_flavor.sh driver mobile/build/app/outputs/bundle/driverRelease/app-driver-release.aab

      - name: Upload driver AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mova-driver-aab
          path: mobile/build/app/outputs/bundle/driverRelease/app-driver-release.aab
          retention-days: 30

      - name: Build passenger APK (install direct)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apks == true }}
        continue-on-error: true
        working-directory: mobile
        run: |
          WEB_CLIENT="58917716638-rbgibno8pdvlud8dd00pdfjdv3q1dh4k.apps.googleusercontent.com"
          flutter build apk --release \
            --flavor passenger \
            -t lib/main_passenger.dart \
            --build-name=${{ steps.playver.outputs.name }} \
            --build-number=${{ steps.playver.outputs.code }} \
            --dart-define=API_URL=${{ steps.urls.outputs.api }} \
            --dart-define=WS_URL=${{ steps.urls.outputs.ws }} \
            --dart-define=APP_BUILD=${{ steps.playver.outputs.code }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$WEB_CLIENT

      - name: Build driver APK (install direct)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apks == true }}
        continue-on-error: true
        working-directory: mobile
        run: |
          WEB_CLIENT="58917716638-rbgibno8pdvlud8dd00pdfjdv3q1dh4k.apps.googleusercontent.com"
          flutter build apk --release \
            --flavor driver \
            -t lib/main_driver.dart \
            --build-name=${{ steps.playver.outputs.name }} \
            --build-number=${{ steps.playver.outputs.code }} \
            --dart-define=API_URL=${{ steps.urls.outputs.api }} \
            --dart-define=WS_URL=${{ steps.urls.outputs.ws }} \
            --dart-define=APP_BUILD=${{ steps.playver.outputs.code }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$WEB_CLIENT

      - name: Upload passenger APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apks == true }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mova-passenger-apk
          path: mobile/build/app/outputs/flutter-apk/app-passenger-release.apk
          retention-days: 30

      - name: Upload driver APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apks == true }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mova-driver-apk
          path: mobile/build/app/outputs/flutter-apk/app-driver-release.apk
          retention-days: 30

  upload-android:
    name: Upload Play Store (internal)
    needs: build-android
    # Toujours après un build AAB réussi (smoke→main, tag v*, workflow_dispatch).
    # Skip uniquement si aucun secret Play n'est configuré. Gate env: production-mobile.
    if: needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    environment: production-mobile
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Needed so sync-mobile-app-version-env.sh can commit the store file.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile/android

      - name: Download passenger AAB
        uses: actions/download-artifact@v4
        with:
          name: mova-passenger-aab
          path: mobile/build/app/outputs/bundle/passengerRelease/

      - name: Download driver AAB
        uses: actions/download-artifact@v4
        with:
          name: mova-driver-aab
          path: mobile/build/app/outputs/bundle/driverRelease/

      - name: Verify AAB artifacts
        run: |
          set -e
          PASSENGER_AAB=mobile/build/app/outputs/bundle/passengerRelease/app-passenger-release.aab
          DRIVER_AAB=mobile/build/app/outputs/bundle/driverRelease/app-driver-release.aab
          ls -la "$PASSENGER_AAB" "$DRIVER_AAB"
          test -s "$PASSENGER_AAB"
          test -s "$DRIVER_AAB"
          bash mobile/tool/verify_aab_flavor.sh passenger "$PASSENGER_AAB"
          bash mobile/tool/verify_aab_flavor.sh driver "$DRIVER_AAB"

      - name: Upload to Play Console internal track (Fastlane)
        working-directory: mobile/android
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -e
          # Accepted secrets (first match wins):
          # - PLAY_STORE_JSON_KEY: service-account JSON encoded base64
          # - PLAY_SERVICE_ACCOUNT_JSON: raw JSON or base64
          # - PLAY_STORE_JSON: raw JSON
          if [ -n "$PLAY_STORE_JSON_KEY" ]; then
            echo "$PLAY_STORE_JSON_KEY" | base64 -d > /tmp/play-store-key.json
          elif [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            if printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | head -c 1 | grep -q '{'; then
              printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > /tmp/play-store-key.json
            else
              echo "$PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > /tmp/play-store-key.json
            fi
          elif [ -n "$PLAY_STORE_JSON" ]; then
            printf '%s' "$PLAY_STORE_JSON" > /tmp/play-store-key.json
          else
            echo "::notice::Secrets Play absents (PLAY_STORE_JSON_KEY / PLAY_SERVICE_ACCOUNT_JSON / PLAY_STORE_JSON). AAB en artefacts Actions — upload ignoré."
            exit 0
          fi
          if ! head -c 1 /tmp/play-store-key.json | grep -q '{'; then
            echo "::error::Clé Play Store invalide (JSON attendu après décodage)."
            exit 1
          fi
          export PLAY_STORE_JSON_KEY_PATH=/tmp/play-store-key.json
          echo "Upload Play internal: cd.mova.mova.passenger + cd.mova.mova.driver"
          bundle exec fastlane deploy_internal
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.promote_to_production }}" = "true" ]; then
            echo "Promote Play internal → production (opt-in)"
            bundle exec fastlane promote_internal_to_production
          fi

      - name: Lock in-app update banners (store file + Render)
        if: success()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERSION_NAME: ${{ needs.build-android.outputs.version_name }}
          VERSION_CODE: ${{ needs.build-android.outputs.version_code }}
          # Optional: push the store-version commit to afri-soft-com/mova (Render git source).
          AFRI_SOFT_PUSH_TOKEN: ${{ secrets.AFRI_SOFT_PUSH_TOKEN }}
        run: bash scripts/sync-mobile-app-version-env.sh

  promote-android-production:
    name: Promote Play internal → production
    if: >
      github.repository != 'afri-soft-com/mova' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.promote_only == true
    runs-on: ubuntu-latest
    environment: production-mobile
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile/android

      - name: Promote internal track to production (Fastlane)
        working-directory: mobile/android
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -e
          if [ -n "$PLAY_STORE_JSON_KEY" ]; then
            echo "$PLAY_STORE_JSON_KEY" | base64 -d > /tmp/play-store-key.json
          elif [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            if printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | head -c 1 | grep -q '{'; then
              printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > /tmp/play-store-key.json
            else
              echo "$PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > /tmp/play-store-key.json
            fi
          elif [ -n "$PLAY_STORE_JSON" ]; then
            printf '%s' "$PLAY_STORE_JSON" > /tmp/play-store-key.json
          else
            echo "::error::Secrets Play absents — promote impossible."
            exit 1
          fi
          if ! head -c 1 /tmp/play-store-key.json | grep -q '{'; then
            echo "::error::Clé Play Store invalide (JSON attendu après décodage)."
            exit 1
          fi
          export PLAY_STORE_JSON_KEY_PATH=/tmp/play-store-key.json
          echo "Promote Play internal → production (passenger + driver)"
          bundle exec fastlane promote_internal_to_production

  build-ios:
    name: Build iOS IPA (${{ matrix.flavor }})
    if: >
      github.repository != 'afri-soft-com/mova' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.asc_submit_only != true &&
        (inputs.build_ios == true || inputs.upload_ios_testflight == true || inputs.submit_ios_app_store == true)))
    # App Store Connect requires iOS 26 SDK (Xcode 26+) as of Apple's 2026 cutoff.
    runs-on: macos-26
    # Parallel passenger/driver — hang on one must not block the other forever.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: passenger
            entry: lib/main_passenger.dart
            export_plist: ios/ExportOptions.plist
            artifact: mova-passenger-ipa
          - flavor: driver
            entry: lib/main_driver.dart
            export_plist: ios/ExportOptions-driver.plist
            artifact: mova-driver-ipa
    outputs:
      # true if either matrix leg uploaded an IPA (upload job tolerates missing artifacts).
      ipa_built: ${{ steps.mark.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve production API URLs
        id: urls
        env:
          SECRET_API: ${{ secrets.PROD_API_URL }}
          SECRET_WS: ${{ secrets.PROD_WS_URL }}
        run: |
          set -euo pipefail
          API="${SECRET_API:-$DEFAULT_PROD_API_URL}"
          WS="${SECRET_WS:-$DEFAULT_PROD_WS_URL}"
          looks_dev() {
            local u="$1"
            echo "$u" | grep -qiE \
              '(localhost|127\.0\.0\.1|10\.0\.2\.2|:3000|://10\.|://192\.168\.|://172\.(1[6-9]|2[0-9]|3[0-1])\.)'
          }
          if looks_dev "$API" || looks_dev "$WS" || [[ "$API" != https://* ]] || [[ "$WS" != https://* ]]; then
            echo "::warning::PROD_API_URL/PROD_WS_URL invalides ou LAN — forçage API production"
            API="$DEFAULT_PROD_API_URL"
            WS="$DEFAULT_PROD_WS_URL"
          fi
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "ws=$WS" >> "$GITHUB_OUTPUT"
          echo "Using API_URL=$API"
          echo "Using WS_URL=$WS"

      - name: Resolve iOS marketing version + build number
        id: iosver
        run: |
          set -euo pipefail
          # Aligné Android : max(run_number, pubspec +N) pour que la bannière
          # currentVersionCode (API) ne reste pas collée après TestFlight.
          FLOOR=157
          PUBSPEC_LINE=$(grep -E '^version:' mobile/pubspec.yaml | head -1)
          NAME=$(printf '%s' "$PUBSPEC_LINE" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          PUBSPEC_CODE=$(printf '%s' "$PUBSPEC_LINE" | sed -E 's/.*\+([0-9]+).*/\1/')
          CODE="${{ github.run_number }}"
          if [ "$CODE" -lt "$FLOOR" ]; then CODE="$FLOOR"; fi
          if [ -n "$PUBSPEC_CODE" ] && [ "$PUBSPEC_CODE" -gt "$CODE" ]; then CODE="$PUBSPEC_CODE"; fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "iOS CFBundleShortVersionString=$NAME CFBundleVersion=$CODE (pubspec +${PUBSPEC_CODE:-?}; run_number=${{ github.run_number }})"

      - name: Check iOS credentials
        id: ios_creds
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -z "${MATCH_PASSWORD}" ] || [ -z "${APP_STORE_CONNECT_API_KEY}" ]; then
            echo "::notice::Certificats iOS non configurés — voir docs/cicd.md"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "iOS credentials present (match + ASC API key)"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.ios_creds.outputs.available == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disable SwiftPM (CocoaPods only — avoids 60m+ SPM hangs on CI)
        if: steps.ios_creds.outputs.available == 'true'
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter pub get (generates iOS pods wiring)
        if: steps.ios_creds.outputs.available == 'true'
        working-directory: mobile
        run: flutter pub get

      - name: Cache CocoaPods
        if: steps.ios_creds.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: |
            mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ hashFiles('mobile/ios/Podfile', 'mobile/pubspec.lock') }}

      - name: Install CocoaPods
        if: steps.ios_creds.outputs.available == 'true'
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          test -f Podfile || { echo "::error::Podfile manquant dans mobile/ios — commit requis."; exit 1; }
          pod install --verbose

      - name: Select Xcode 26 + CI signing prep
        if: steps.ios_creds.outputs.available == 'true'
        run: |
          set -euo pipefail
          # ASC rejects IPA built with iOS 18.5 SDK — need Xcode 26+ (iOS 26 SDK).
          for cand in \
              /Applications/Xcode_26.6.app \
              /Applications/Xcode_26.5.app \
              /Applications/Xcode_26.4.1.app \
              /Applications/Xcode_26.4.app \
              /Applications/Xcode_26.3.app \
              /Applications/Xcode_26.2.app \
              /Applications/Xcode_26.app \
              /Applications/Xcode.app; do
            if [ -d "$cand" ]; then
              sudo xcode-select -s "$cand"
              break
            fi
          done
          xcodebuild -version
          xcrun --show-sdk-version || true
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES || true
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES || true

      - name: Import signing certificates (match)
        if: steps.ios_creds.outputs.available == 'true'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          MATCH_READONLY: ${{ vars.MATCH_READONLY || 'false' }}
          CI: 'true'
        run: |
          set -euo pipefail
          # Enable Sign in with Apple on App IDs before regenerating match profiles.
          # macOS runners use PEP 668 — install deps in a venv, not system pip.
          python3 -m venv /tmp/asc-siwa-venv
          # shellcheck disable=SC1091
          source /tmp/asc-siwa-venv/bin/activate
          pip install --quiet PyJWT cryptography
          python "$(git rev-parse --show-toplevel)/scripts/asc_enable_sign_in_with_apple.py"
          deactivate || true
          cd mobile/ios
          bundle install
          bundle exec fastlane sync_certificates
          security list-keychains -d user
          security find-identity -v -p codesigning || true

      - name: Build ${{ matrix.flavor }} IPA
        id: build_ipa
        if: steps.ios_creds.outputs.available == 'true'
        working-directory: mobile
        timeout-minutes: 75
        env:
          VERBOSE_SCRIPT_LOGGING: 'YES'
          # Keep match CI keychain available for codesign during archive.
          CI: 'true'
          GOOGLE_IOS_CLIENT_ID_PASSENGER: ${{ secrets.GOOGLE_IOS_CLIENT_ID_PASSENGER }}
          GOOGLE_IOS_CLIENT_ID_DRIVER: ${{ secrets.GOOGLE_IOS_CLIENT_ID_DRIVER }}
          GOOGLE_SERVICE_INFO_PASSENGER_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PASSENGER_BASE64 }}
          GOOGLE_SERVICE_INFO_DRIVER_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_DRIVER_BASE64 }}
        run: |
          set -euo pipefail
          WEB_CLIENT="58917716638-rbgibno8pdvlud8dd00pdfjdv3q1dh4k.apps.googleusercontent.com"
          # Same public defaults as ios/ci_set_flavor.sh — never pass an empty
          # dart-define (empty clientId + nil keyWindow → native crash on tap).
          PASSENGER_IOS_DEFAULT="58917716638-9qupcijrhjr7dvd5v1efmi9elitmndnd.apps.googleusercontent.com"
          DRIVER_IOS_DEFAULT="58917716638-q5i6cr1hv085ri1k7tpot6sggvcv9qih.apps.googleusercontent.com"
          if [ "${{ matrix.flavor }}" = "driver" ]; then
            IOS_CLIENT="${GOOGLE_IOS_CLIENT_ID_DRIVER:-$DRIVER_IOS_DEFAULT}"
          else
            IOS_CLIENT="${GOOGLE_IOS_CLIENT_ID_PASSENGER:-$PASSENGER_IOS_DEFAULT}"
          fi
          if [ -z "$IOS_CLIENT" ]; then
            echo "::error::GOOGLE_IOS_CLIENT_ID empty for ${{ matrix.flavor }}"
            exit 1
          fi
          # Firebase iOS plists (fallback if not committed): secrets per flavor.
          if [ ! -f "ios/Runner/GoogleService-Info-${{ matrix.flavor }}.plist" ]; then
            if [ "${{ matrix.flavor }}" = "driver" ] && [ -n "${GOOGLE_SERVICE_INFO_DRIVER_BASE64:-}" ]; then
              echo "$GOOGLE_SERVICE_INFO_DRIVER_BASE64" | base64 -d > "ios/Runner/GoogleService-Info-driver.plist"
            elif [ "${{ matrix.flavor }}" = "passenger" ] && [ -n "${GOOGLE_SERVICE_INFO_PASSENGER_BASE64:-}" ]; then
              echo "$GOOGLE_SERVICE_INFO_PASSENGER_BASE64" | base64 -d > "ios/Runner/GoogleService-Info-passenger.plist"
            fi
          fi
          bash ios/ci_set_flavor.sh "${{ matrix.flavor }}"
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
          echo "::group::flutter build ipa (${{ matrix.flavor }})"
          # No --verbose: huge showBuildSettings dumps hide real archive progress.
          flutter build ipa --release \
            -t ${{ matrix.entry }} \
            --build-name=${{ steps.iosver.outputs.name }} \
            --build-number=${{ steps.iosver.outputs.code }} \
            --dart-define=APP_BUILD=${{ steps.iosver.outputs.code }} \
            --dart-define=API_URL=${{ steps.urls.outputs.api }} \
            --dart-define=WS_URL=${{ steps.urls.outputs.ws }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$WEB_CLIENT \
            --dart-define=GOOGLE_IOS_CLIENT_ID=$IOS_CLIENT \
            --export-options-plist=${{ matrix.export_plist }}
          echo "::endgroup::"
          mkdir -p "$RUNNER_TEMP/mova-ipa/${{ matrix.flavor }}"
          shopt -s nullglob
          for f in build/ios/ipa/*.ipa; do
            mv "$f" "$RUNNER_TEMP/mova-ipa/${{ matrix.flavor }}/"
          done
          ls -la "$RUNNER_TEMP/mova-ipa/${{ matrix.flavor }}/"
          test -n "$(ls -A "$RUNNER_TEMP/mova-ipa/${{ matrix.flavor }}/"*.ipa 2>/dev/null)"

      - name: Upload ${{ matrix.flavor }} IPA artifact
        if: steps.build_ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/mova-ipa/${{ matrix.flavor }}/*.ipa
          retention-days: 30

      - name: Mark IPA built
        id: mark
        if: always()
        run: |
          if [ "${{ steps.build_ipa.outcome }}" = "success" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

  upload-ios:
    name: Upload TestFlight + App Store
    needs: build-ios
    if: >
      always() &&
      needs.build-ios.result != 'cancelled' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.asc_submit_only != true &&
        (inputs.upload_ios_testflight == true || inputs.submit_ios_app_store == true)))
    runs-on: macos-26
    environment: production-mobile
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile/ios

      - name: Download passenger IPA
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mova-passenger-ipa
          path: mobile/build/ios/ipa/passenger/

      - name: Download driver IPA
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mova-driver-ipa
          path: mobile/build/ios/ipa/driver/

      - name: Upload TestFlight + submit App Store production
        working-directory: mobile/ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          SUBMIT_APP_STORE: ${{ (github.event_name == 'workflow_dispatch' && inputs.submit_ios_app_store == true) || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          if [ -z "${APP_STORE_CONNECT_API_KEY:-}" ]; then
            echo "::notice::APP_STORE_CONNECT_API_KEY non configuré — publication iOS ignorée."
            exit 0
          fi
          # Absolute paths — Fastlane cwd can be fastlane/; also "Senga Driver.ipa" has a space.
          PASSENGER_IPA="$(find "$(pwd)/../build/ios/ipa/passenger" -name '*.ipa' 2>/dev/null | head -1 || true)"
          DRIVER_IPA="$(find "$(pwd)/../build/ios/ipa/driver" -name '*.ipa' 2>/dev/null | head -1 || true)"
          if [ -z "${PASSENGER_IPA}" ] && [ -z "${DRIVER_IPA}" ]; then
            echo "::error::Aucun IPA téléchargé — build iOS a échoué."
            find ../build/ios/ipa -type f 2>/dev/null || true
            exit 1
          fi
          echo "SUBMIT_APP_STORE=${SUBMIT_APP_STORE}"
          echo "passenger_ipa=${PASSENGER_IPA:-<none>}"
          echo "driver_ipa=${DRIVER_IPA:-<none>}"
          # Prefer env vars over CLI options so spaces in filenames are safe.
          export PASSENGER_IPA DRIVER_IPA
          bundle exec fastlane release_both
          if [ "${SUBMIT_APP_STORE}" = "true" ]; then
            # macOS runners use PEP 668 — install deps in a venv, not system pip.
            python3 -m venv /tmp/asc-venv
            # shellcheck disable=SC1091
            source /tmp/asc-venv/bin/activate
            pip install --quiet PyJWT cryptography
            export ASC_VERSION=1.0.32
            # Même logique que build-ios (max run_number / pubspec +N), pas run_number seul.
            FLOOR=157
            PUBSPEC_LINE=$(grep -E '^version:' "$(git rev-parse --show-toplevel)/mobile/pubspec.yaml" | head -1)
            PUBSPEC_CODE=$(printf '%s' "$PUBSPEC_LINE" | sed -E 's/.*\+([0-9]+).*/\1/')
            ASC_CODE="${{ github.run_number }}"
            if [ "$ASC_CODE" -lt "$FLOOR" ]; then ASC_CODE="$FLOOR"; fi
            if [ -n "$PUBSPEC_CODE" ] && [ "$PUBSPEC_CODE" -gt "$ASC_CODE" ]; then ASC_CODE="$PUBSPEC_CODE"; fi
            export ASC_BUILD_NUMBER="$ASC_CODE"
            export ASC_SUBMIT=true
            export ASC_REPLACE_IN_REVIEW=true
            export ASC_SUBMIT_ATTEMPTS=8
            export ASC_SUBMIT_RETRY_SECONDS=60
            python "$(git rev-parse --show-toplevel)/scripts/asc_update_review_and_submit.py"
          fi

  asc-submit-only:
    name: App Store Connect submit (no rebuild)
    if: >
      github.repository != 'afri-soft-com/mova' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.asc_submit_only == true
    runs-on: ubuntu-latest
    environment: production-mobile
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Submit Senga + Senga Driver for App Store review
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_VERSION: '1.0.32'
          ASC_BUILD_NUMBER: ${{ inputs.asc_build_number }}
          ASC_SUBMIT: 'true'
          # Cancel WAITING_FOR_REVIEW so we can attach the new TestFlight build.
          ASC_REPLACE_IN_REVIEW: 'true'
          ASC_SUBMIT_ATTEMPTS: '8'
          ASC_SUBMIT_RETRY_SECONDS: '60'
        run: |
          set -euo pipefail
          if [ -z "${APP_STORE_CONNECT_API_KEY:-}" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY manquant"
            exit 1
          fi
          python3 -m pip install --quiet PyJWT cryptography
          echo "ASC_VERSION=$ASC_VERSION ASC_BUILD_NUMBER=${ASC_BUILD_NUMBER:-<latest VALID>} ASC_REPLACE_IN_REVIEW=$ASC_REPLACE_IN_REVIEW"
          python3 scripts/asc_update_review_and_submit.py
          # (ubuntu + setup-python: system pip is fine)
