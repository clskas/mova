# One-shot / ops: restore critical Render env vars after accidental wipe.
# Uses GitHub secrets (never echoed). Safe to re-run.
#
# IMPORTANT: upserts one key at a time. Never bulk PUT /env-vars — that wipes
# every key not in the payload (and hid update banners / broke deploys).
name: Restore Render Env

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore auth / ride / payment env vars
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DATABASE_URL_AUTH: ${{ secrets.DATABASE_URL_AUTH }}
          DATABASE_URL_RIDES: ${{ secrets.DATABASE_URL_RIDES }}
          DATABASE_URL_PAYMENTS: ${{ secrets.DATABASE_URL_PAYMENTS }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then echo "::error::RENDER_API_KEY missing"; exit 1; fi
          if [ -z "${DATABASE_URL_AUTH:-}" ] || [ -z "${DATABASE_URL_RIDES:-}" ] || [ -z "${DATABASE_URL_PAYMENTS:-}" ]; then
            echo "::error::DATABASE_URL_AUTH/RIDES/PAYMENTS secrets required"; exit 1
          fi
          if [ -z "${REDIS_URL:-}" ]; then echo "::error::REDIS_URL secret required"; exit 1; fi

          upsert_env() {
            local sid="$1"
            local key="$2"
            local value="$3"
            if [ -z "$value" ]; then
              echo "  skip ${key} (empty)"
              return 0
            fi
            code=$(curl -sS -o /tmp/render-env-out.json -w "%{http_code}" -X PUT \
              "https://api.render.com/v1/services/${sid}/env-vars/$(python -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$key")" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg v "$value" '{value:$v}')")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::Render env upsert failed for ${sid} ${key} HTTP ${code}"
              exit 1
            fi
            echo "  OK ${key}"
          }

          upsert_many() {
            local sid="$1"
            shift
            echo "Updating service ${sid} (per-key upsert, no wipe)"
            while [ "$#" -ge 2 ]; do
              upsert_env "$sid" "$1" "$2"
              shift 2
            done
          }

          AUTH_ID="srv-d8slrk8js32c73dac310"
          RIDE_ID="srv-d8slrlernols73b4bcq0"
          PAY_ID="srv-d8slrm8g4nts73bq9pj0"

          upsert_many "$AUTH_ID" \
            DATABASE_URL "$DATABASE_URL_AUTH" \
            REDIS_URL "$REDIS_URL" \
            MOCK_OTP "false" \
            ALLOW_TEST_OTP "false" \
            NODE_ENV "production" \
            APP_ENV "production" \
            RUN_SEED "false" \
            SKIP_DEMO_SEED "true" \
            SEED_DEMO_CATALOG "false" \
            SMS_PROVIDER "africastalking" \
            AFRICAS_TALKING_ENV "production" \
            AFRICAS_TALKING_SMS_SENDER "MOVA" \
            MOBILE_MONEY_GATEWAY "serdipay" \
            SERDIPAY_BASE_URL "https://apis.serdipay.com" \
            SUPABASE_URL "https://furttqrltkwirdhiktdl.supabase.co" \
            SUPABASE_UPLOADS_BUCKET "uploads" \
            SUPABASE_KYC_BUCKET "kyc-docs" \
            JWT_SECRET "${JWT_SECRET:-}"

          upsert_many "$RIDE_ID" \
            DATABASE_URL "$DATABASE_URL_RIDES" \
            REDIS_URL "$REDIS_URL" \
            DRIVER_SERVICE_URL "https://mova-driver.onrender.com" \
            MOCK_PAYMENTS "false" \
            NODE_ENV "production" \
            APP_ENV "production" \
            RUN_SEED "false" \
            SKIP_DEMO_SEED "true" \
            SEED_DEMO_CATALOG "false" \
            SMS_PROVIDER "africastalking" \
            MOBILE_MONEY_GATEWAY "serdipay" \
            SERDIPAY_BASE_URL "https://apis.serdipay.com" \
            SUPABASE_URL "https://furttqrltkwirdhiktdl.supabase.co" \
            SUPABASE_UPLOADS_BUCKET "uploads" \
            SUPABASE_KYC_BUCKET "kyc-docs" \
            MOBILE_PASSENGER_VERSION "1.0.5" \
            MOBILE_DRIVER_VERSION "1.0.5" \
            MOBILE_MIN_VERSION "1.0.0" \
            MOBILE_PASSENGER_VERSION_CODE "70" \
            MOBILE_DRIVER_VERSION_CODE "70" \
            MOBILE_MIN_VERSION_CODE "0" \
            PLAY_STORE_PASSENGER_URL "https://play.google.com/store/apps/details?id=cd.mova.mova.passenger" \
            PLAY_STORE_DRIVER_URL "https://play.google.com/store/apps/details?id=cd.mova.mova.driver" \
            JWT_SECRET "${JWT_SECRET:-}"

          upsert_many "$PAY_ID" \
            DATABASE_URL "$DATABASE_URL_PAYMENTS" \
            REDIS_URL "$REDIS_URL" \
            RIDE_SERVICE_URL "https://mova-ride.onrender.com" \
            MOCK_PAYMENTS "false" \
            NODE_ENV "production" \
            APP_ENV "production" \
            RUN_SEED "false" \
            SKIP_DEMO_SEED "true" \
            SEED_DEMO_CATALOG "false" \
            SMS_PROVIDER "africastalking" \
            MOBILE_MONEY_GATEWAY "serdipay" \
            SERDIPAY_BASE_URL "https://apis.serdipay.com" \
            SUPABASE_URL "https://furttqrltkwirdhiktdl.supabase.co" \
            SUPABASE_UPLOADS_BUCKET "uploads" \
            SUPABASE_KYC_BUCKET "kyc-docs" \
            JWT_SECRET "${JWT_SECRET:-}"

          echo "Restore complete (per-key upsert). Redeploy ride/auth/payment so banners pick up versionCode 70."
