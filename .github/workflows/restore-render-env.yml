# One-shot / ops: restore critical Render env vars after accidental wipe.
# Prefers live Render Postgres connection strings (mova-db-auth) so we never
# accidentally point prod at legacy Neon. GitHub DATABASE_URL_* secrets are NOT
# used for prod DATABASE_URL (they previously pointed at Neon and emptied the
# app's view of users).
#
# IMPORTANT: upserts one key at a time. Never bulk PUT /env-vars — that wipes
# every key not in the payload (and hid update banners / broke deploys).
name: Restore Render Env

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore auth / ride / payment env vars
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AFRISOFT_SMS_HUB_URL: ${{ secrets.AFRISOFT_SMS_HUB_URL }}
          AFRISOFT_HUB_APP_ID: ${{ secrets.AFRISOFT_HUB_APP_ID }}
          AFRISOFT_HUB_API_KEY: ${{ secrets.AFRISOFT_HUB_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then echo "::error::RENDER_API_KEY missing"; exit 1; fi
          if [ -z "${REDIS_URL:-}" ]; then echo "::error::REDIS_URL secret required"; exit 1; fi

          # Canonical prod DB is Render Postgres mova-db-auth (multi-db).
          MOVA_PG_ID="dpg-daa5u3on74is739uken0-a"
          CONN_JSON=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/postgres/${MOVA_PG_ID}/connection-info")
          BASE_DSN=$(echo "$CONN_JSON" | jq -r '.externalConnectionString // .connectionString // empty')
          if [ -z "$BASE_DSN" ]; then
            echo "::error::Could not read mova-db-auth externalConnectionString"; exit 1
          fi
          if [[ "$BASE_DSN" != *".render.com"* ]]; then
            echo "::error::Unexpected non-Render DSN from mova-db-auth"; exit 1
          fi

          dsn_for() {
            local db="$1"
            python -c "import os,re,sys; b=os.environ['BASE_DSN']; db=sys.argv[1]; print(re.sub(r'/[^/?]+(\\?|$)', '/' + db + r'\\1', b))" "$db"
          }
          export BASE_DSN
          DATABASE_URL_AUTH="$(dsn_for mova_auth)"
          DATABASE_URL_RIDES="$(dsn_for mova_rides)"
          DATABASE_URL_PAYMENTS="$(dsn_for mova_payments)"
          echo "Using Render Postgres mova-db-auth for DATABASE_URL_* (not Neon)"

          assert_render_dsn() {
            local name="$1" url="$2"
            if [[ "$url" == *"neon.tech"* ]]; then
              echo "::error::${name} points at Neon — refuse (prod is Render Postgres)"; exit 1
            fi
            if [[ "$url" != *".render.com"* ]]; then
              echo "::error::${name} must be a Render external URL"; exit 1
            fi
          }
          assert_render_dsn DATABASE_URL_AUTH "$DATABASE_URL_AUTH"
          assert_render_dsn DATABASE_URL_RIDES "$DATABASE_URL_RIDES"
          assert_render_dsn DATABASE_URL_PAYMENTS "$DATABASE_URL_PAYMENTS"

          upsert_env() {
            local sid="$1"
            local key="$2"
            local value="$3"
            if [ -z "$value" ]; then
              echo "  skip ${key} (empty)"
              return 0
            fi
            code=$(curl -sS -o /tmp/render-env-out.json -w "%{http_code}" -X PUT \
              "https://api.render.com/v1/services/${sid}/env-vars/$(python -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$key")" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg v "$value" '{value:$v}')")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::Render env upsert failed for ${sid} ${key} HTTP ${code}"
              exit 1
            fi
            echo "  OK ${key}"
          }

          upsert_many() {
            local sid="$1"
            shift
            echo "Updating service ${sid} (per-key upsert, no wipe)"
            while [ "$#" -ge 2 ]; do
              upsert_env "$sid" "$1" "$2"
              shift 2
            done
          }

          AUTH_ID="srv-d8slrk8js32c73dac310"
          RIDE_ID="srv-d8slrlernols73b4bcq0"
          PAY_ID="srv-d8slrm8g4nts73bq9pj0"

          # OTP login uses AfriSoft SMS hub (sms.afri-soft.com). Do NOT force
          # africastalking alone — that left mova-auth without a working SMS path
          # after env wipe and showed « Service temporairement indisponible » on Continuer.
          AFRISOFT_SMS_HUB_URL="${AFRISOFT_SMS_HUB_URL:-https://sms.afri-soft.com}"
          AFRISOFT_HUB_APP_ID="${AFRISOFT_HUB_APP_ID:-senga}"
          if [ -z "${AFRISOFT_HUB_API_KEY:-}" ]; then
            echo "::warning::AFRISOFT_HUB_API_KEY secret missing — auth OTP SMS will fail until set"
          fi

          upsert_many "$AUTH_ID" \
            DATABASE_URL "$DATABASE_URL_AUTH" \
            REDIS_URL "$REDIS_URL" \
            MOCK_OTP "false" \
            ALLOW_TEST_OTP "false" \
            NODE_ENV "production" \
            APP_ENV "production" \
            RUN_SEED "false" \
            SKIP_DEMO_SEED "true" \
            SEED_DEMO_CATALOG "false" \
            SMS_PROVIDER "afrisoft" \
            AFRISOFT_SMS_HUB_URL "$AFRISOFT_SMS_HUB_URL" \
            AFRISOFT_HUB_APP_ID "$AFRISOFT_HUB_APP_ID" \
            AFRISOFT_HUB_API_KEY "${AFRISOFT_HUB_API_KEY:-}" \
            MOBILE_MONEY_GATEWAY "serdipay" \
            SERDIPAY_BASE_URL "https://apis.serdipay.com" \
            SUPABASE_URL "https://furttqrltkwirdhiktdl.supabase.co" \
            SUPABASE_UPLOADS_BUCKET "uploads" \
            SUPABASE_KYC_BUCKET "kyc-docs" \
            PAYMENT_SERVICE_URL "https://mova-payment.onrender.com" \
            JWT_SECRET "${JWT_SECRET:-}"

          upsert_many "$RIDE_ID" \
            DATABASE_URL "$DATABASE_URL_RIDES" \
            REDIS_URL "$REDIS_URL" \
            AUTH_SERVICE_URL "https://mova-auth.onrender.com" \
            DRIVER_SERVICE_URL "https://mova-driver.onrender.com" \
            PAYMENT_SERVICE_URL "https://mova-payment.onrender.com" \
            MOCK_PAYMENTS "false" \
            NODE_ENV "production" \
            APP_ENV "production" \
            RUN_SEED "false" \
            SKIP_DEMO_SEED "true" \
            SEED_DEMO_CATALOG "false" \
            SMS_PROVIDER "africastalking" \
            MOBILE_MONEY_GATEWAY "serdipay" \
            SERDIPAY_BASE_URL "https://apis.serdipay.com" \
            SUPABASE_URL "https://furttqrltkwirdhiktdl.supabase.co" \
            SUPABASE_UPLOADS_BUCKET "uploads" \
            SUPABASE_KYC_BUCKET "kyc-docs" \
            MOBILE_PASSENGER_VERSION "1.0.5" \
            MOBILE_DRIVER_VERSION "1.0.5" \
            MOBILE_MIN_VERSION "1.0.0" \
            MOBILE_PASSENGER_VERSION_CODE "70" \
            MOBILE_DRIVER_VERSION_CODE "70" \
            MOBILE_MIN_VERSION_CODE "0" \
            PLAY_STORE_PASSENGER_URL "https://play.google.com/store/apps/details?id=cd.mova.mova.passenger" \
            PLAY_STORE_DRIVER_URL "https://play.google.com/store/apps/details?id=cd.mova.mova.driver" \
            JWT_SECRET "${JWT_SECRET:-}"

          upsert_many "$PAY_ID" \
            DATABASE_URL "$DATABASE_URL_PAYMENTS" \
            REDIS_URL "$REDIS_URL" \
            AUTH_SERVICE_URL "https://mova-auth.onrender.com" \
            RIDE_SERVICE_URL "https://mova-ride.onrender.com" \
            MOCK_PAYMENTS "false" \
            NODE_ENV "production" \
            APP_ENV "production" \
            RUN_SEED "false" \
            SKIP_DEMO_SEED "true" \
            SEED_DEMO_CATALOG "false" \
            SMS_PROVIDER "africastalking" \
            MOBILE_MONEY_GATEWAY "serdipay" \
            SERDIPAY_BASE_URL "https://apis.serdipay.com" \
            SUPABASE_URL "https://furttqrltkwirdhiktdl.supabase.co" \
            SUPABASE_UPLOADS_BUCKET "uploads" \
            SUPABASE_KYC_BUCKET "kyc-docs" \
            JWT_SECRET "${JWT_SECRET:-}"

          echo "Restore complete (per-key upsert). Redeploy ride/auth/payment so banners pick up versionCode 70."
