name: Rollback Production

# One-click "go back to the previous version" (Actions → Rollback Production → Run).
# Without a commit, it picks the commit that was live on Render before the current one.
# It then runs the normal Deploy (production + payment hub, with snapshot, checks and
# auto-rollback) for that commit, skipping the staging gate: the commit was already live.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to restore (vide = la version d'avant). Doit exister sur afri-soft-com/mova."
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  rollback:
    if: github.repository != 'afri-soft-com/mova'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version to restore
        id: pick
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          WANTED: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [ -n "$WANTED" ]; then
            echo "commit=$WANTED" >> "$GITHUB_OUTPUT"
            echo "Restoring requested commit $WANTED"
            exit 0
          fi
          gw=$(jq -r '.gatewayServiceId' config/render-services.json)
          deploys=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$gw/deploys?limit=30" | jq '[.[] | (.deploy // .)]')
          current=$(jq -r '[.[] | select(.status == "live")][0].commit.id // empty' <<<"$deploys")
          previous=$(jq -r --arg cur "$current" \
            '[.[] | select(.status == "deactivated" and .commit.id != null and .commit.id != $cur)][0].commit.id // empty' <<<"$deploys")
          if [ -z "$current" ] || [ -z "$previous" ]; then
            echo "::error::Cannot find the previous production version — pass a commit explicitly."
            exit 1
          fi
          echo "Live: $current — restoring previous: $previous"
          echo "commit=$previous" >> "$GITHUB_OUTPUT"

      - name: Deploy the previous version (skips the staging gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f environment=production -f commit="${{ steps.pick.outputs.commit }}" -f skip_staging=true
          echo "::notice::Rollback to ${{ steps.pick.outputs.commit }} started — follow it in Actions → Deploy."
