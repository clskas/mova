name: Smoke Tests Production

on:
  workflow_dispatch:
  workflow_call:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        env:
          API_URL: ${{ secrets.SMOKE_API_URL || 'http://localhost:3000' }}
        run: |
          chmod +x scripts/smoke-test.sh
          scripts/smoke-test.sh || echo "Smoke tests require running API"
