name: Smoke Tests Production

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      gateway_url:
        description: Gateway URL override
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  smoke:
    if: >
      github.repository != 'afri-soft-com/mova' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: compares mobile/ with the last Android build (internal track step).
          fetch-depth: 0

      - name: Run production smoke tests
        run: |
          GATEWAY_URL="${{ inputs.gateway_url || vars.GATEWAY_URL }}"
          if [ -z "$GATEWAY_URL" ] && [ -f config/render-services.json ]; then
            GATEWAY_URL=$(jq -r '.gatewayUrl // empty' config/render-services.json)
          fi
          if [ -z "$GATEWAY_URL" ]; then
            GATEWAY_URL="${{ secrets.SMOKE_API_URL }}"
          fi
          if [ -z "$GATEWAY_URL" ]; then
            echo "::error::Set vars.GATEWAY_URL, config/render-services.json, or SMOKE_API_URL"
            exit 1
          fi
          # SMOKE_API_URL is often .../api — /health lives at gateway root
          GATEWAY_URL="${GATEWAY_URL%/}"
          GATEWAY_URL="${GATEWAY_URL%/api}"
          chmod +x scripts/smoke-test.sh
          echo "Testing $GATEWAY_URL"
          for i in $(seq 1 18); do
            if curl -sf -o /dev/null "${GATEWAY_URL}/health"; then
              echo "Gateway ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 18 ]; then
              echo "::error::Gateway still unreachable at ${GATEWAY_URL}/health after cold-start wait"
              exit 1
            fi
            echo "Waiting for gateway cold start ($i/18)..."
            sleep 15
          done
          echo "Waiting for ride-service (geo/communes)..."
          for i in $(seq 1 20); do
            ride_status=$(curl -sf "${GATEWAY_URL}/health" | jq -r '.services[]? | select(.name=="ride") | .status // empty')
            if [ "$ride_status" = "ok" ]; then
              echo "ride-service ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::warning::ride-service not ready — geo/estimate checks may warn"
            fi
            sleep 15
          done
          GATEWAY_URL="$GATEWAY_URL" ./scripts/smoke-test.sh

      # Mobile Release would be a 4th level of workflow_run chaining, which GitHub
      # silently ignores. Dispatch it explicitly: AAB to the Play internal track only
      # (no production promotion, no banner change). Production releases use a v* tag.
      # Only when the mobile app changed since the last Android build: a web / server
      # change alone does not need a new app build.
      - name: Did the mobile app change since the last Android build?
        id: mobile_changed
        if: ${{ success() && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin main
          # Last Mobile Release run whose « Build Android (AAB) » job succeeded.
          LAST=""
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mobile-release.yml/runs?status=success&per_page=30" \
              --jq '.workflow_runs[] | "\(.id):\(.head_sha)"'); do
            id="${run%%:*}"; sha="${run##*:}"
            built=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=50" \
              --jq '[.jobs[] | select(.name | startswith("Build Android")) | select(.conclusion == "success")] | length')
            if [ "${built:-0}" -gt 0 ]; then LAST="$sha"; break; fi
          done
          if [ -z "$LAST" ] || ! git cat-file -e "$LAST^{commit}" 2>/dev/null; then
            echo "No previous Android build found — building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$LAST" "$HEAD_SHA" -- mobile/ .github/workflows/mobile-release.yml; then
            echo "Mobile app unchanged since ${LAST:0:8} — no internal build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Mobile app changed since ${LAST:0:8} — internal build."
            git diff --stat "$LAST" "$HEAD_SHA" -- mobile/ .github/workflows/mobile-release.yml | tail -5
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Mobile Release (internal track)
        if: ${{ success() && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && steps.mobile_changed.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mobile-release.yml --repo "$GITHUB_REPOSITORY" --ref main
