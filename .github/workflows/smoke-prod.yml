name: Smoke Tests Production

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      gateway_url:
        description: Gateway URL override
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  smoke:
    if: >
      github.repository != 'afri-soft-com/mova' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Run production smoke tests
        run: |
          GATEWAY_URL="${{ inputs.gateway_url || vars.GATEWAY_URL }}"
          if [ -z "$GATEWAY_URL" ] && [ -f config/render-services.json ]; then
            GATEWAY_URL=$(jq -r '.gatewayUrl // empty' config/render-services.json)
          fi
          if [ -z "$GATEWAY_URL" ]; then
            GATEWAY_URL="${{ secrets.SMOKE_API_URL }}"
          fi
          if [ -z "$GATEWAY_URL" ]; then
            echo "::error::Set vars.GATEWAY_URL, config/render-services.json, or SMOKE_API_URL"
            exit 1
          fi
          # SMOKE_API_URL is often .../api — /health lives at gateway root
          GATEWAY_URL="${GATEWAY_URL%/}"
          GATEWAY_URL="${GATEWAY_URL%/api}"
          chmod +x scripts/smoke-test.sh
          echo "Testing $GATEWAY_URL"
          for i in $(seq 1 18); do
            if curl -sf -o /dev/null "${GATEWAY_URL}/health"; then
              echo "Gateway ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 18 ]; then
              echo "::error::Gateway still unreachable at ${GATEWAY_URL}/health after cold-start wait"
              exit 1
            fi
            echo "Waiting for gateway cold start ($i/18)..."
            sleep 15
          done
          echo "Waiting for ride-service (geo/communes)..."
          for i in $(seq 1 20); do
            ride_status=$(curl -sf "${GATEWAY_URL}/health" | jq -r '.services[]? | select(.name=="ride") | .status // empty')
            if [ "$ride_status" = "ok" ]; then
              echo "ride-service ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::warning::ride-service not ready — geo/estimate checks may warn"
            fi
            sleep 15
          done
          GATEWAY_URL="$GATEWAY_URL" ./scripts/smoke-test.sh

      # Mobile Release would be a 4th level of workflow_run chaining, which GitHub
      # silently ignores. Dispatch it explicitly: AAB to the Play internal track only
      # (no production promotion, no banner change). Production releases use a v* tag.
      - name: Trigger Mobile Release (internal track)
        if: ${{ success() && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mobile-release.yml --repo "$GITHUB_REPOSITORY" --ref main
