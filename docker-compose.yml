
services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  # Instance Postgres unique — 5 bases logiques (voir docker/postgres/init-databases.sql)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mova
      POSTGRES_PASSWORD: mova
      POSTGRES_DB: mova_auth
    ports:
      # Host 48080 (éviter plages réservées Windows Hyper-V). Services Docker : postgres:5432.
      - '48080:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/02-init-databases.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mova -d mova_auth']
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: docker/auth.Dockerfile
    ports:
      - '3011:3000'
    env_file:
      - config/external-apis.env
    environment:
      # Dockerfile defaults to NODE_ENV=production, which forbids MOCK_OTP and breaks Playwright.
      NODE_ENV: development
      MOCK_OTP: "true"
      ALLOW_TEST_OTP: "true"
      DATABASE_URL: postgresql://mova:mova@postgres:5432/mova_auth
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local_dev_jwt_secret_32chars_min_ok
      # MOCK_OTP + Twilio : config/external-apis.env (gitignored). Sans ce fichier → copier depuis external-apis.env.example
      PAYMENT_SERVICE_URL: http://payment-service:3000
      DRIVER_SERVICE_URL: http://driver-service:3000
      INTERNAL_API_KEY: mova-internal-dev-key-24
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      payment-service:
        condition: service_started
      driver-service:
        condition: service_started

  ride-service:
    build:
      context: .
      dockerfile: docker/ride.Dockerfile
    ports:
      - '3022:3000'
    env_file:
      - config/external-apis.env
    environment:
      DATABASE_URL: postgresql://mova:mova@postgres:5432/mova_rides
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local_dev_jwt_secret_32chars_min_ok
      DRIVER_SERVICE_URL: http://driver-service:3000
      AUTH_SERVICE_URL: http://auth-service:3000
      INTERNAL_API_KEY: mova-internal-dev-key-24
      OSRM_BASE_URL: https://router.project-osrm.org
      OSRM_ENABLED: 'true'
      OSRM_TIMEOUT_MS: '5000'
      NOMINATIM_BASE_URL: https://nominatim.openstreetmap.org
      NOMINATIM_ENABLED: 'true'
      NOMINATIM_TIMEOUT_MS: '5000'
      NOMINATIM_MIN_INTERVAL_MS: '1000'
      NOMINATIM_USER_AGENT: SENGA-RDC/1.0 (ride-service; https://mova.cd)
      PHOTON_BASE_URL: https://photon.komoot.io
      PHOTON_ENABLED: 'true'
      PHOTON_TIMEOUT_MS: '8000'
      # Docker Windows : Nominatim/OSRM publics souvent injoignables — Photon en priorité.
      GEOCODE_PREFER_PHOTON: 'true'
      MOBILE_PASSENGER_VERSION: '1.0.2'
      MOBILE_DRIVER_VERSION: '1.0.2'
      MOBILE_MIN_VERSION: '1.0.0'
      DOCKER: 'true'
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: docker/payment.Dockerfile
    ports:
      - '3003:3000'
    environment:
      DATABASE_URL: postgresql://mova:mova@postgres:5432/mova_payments
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local_dev_jwt_secret_32chars_min_ok
      # Dev local : paiements simulés. Production : NODE_ENV=production + MOCK_PAYMENTS=false + clés Orange/M-Pesa/Airtel
      # MOCK_PAYMENTS=true n'est autorisé qu'en dehors de NODE_ENV=production (garde anti-mock en prod).
      NODE_ENV: development
      MOCK_PAYMENTS: 'true'
      RIDE_SERVICE_URL: http://ride-service:3000
      INTERNAL_API_KEY: mova-internal-dev-key-24
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  driver-service:
    build:
      context: .
      dockerfile: docker/driver.Dockerfile
    ports:
      - '3004:3000'
    environment:
      DATABASE_URL: postgresql://mova:mova@postgres:5432/mova_drivers
      JWT_SECRET: local_dev_jwt_secret_32chars_min_ok
      AUTH_SERVICE_URL: http://auth-service:3000
      RIDE_SERVICE_URL: http://ride-service:3000
      PAYMENT_SERVICE_URL: http://payment-service:3000
      INTERNAL_API_KEY: mova-internal-dev-key-24
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: docker/notification.Dockerfile
    ports:
      - '3005:3000'
    env_file:
      - config/external-apis.env
    environment:
      DATABASE_URL: postgresql://mova:mova@postgres:5432/mova_notifications
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local_dev_jwt_secret_32chars_min_ok
      AUTH_SERVICE_URL: http://auth-service:3000
      INTERNAL_API_KEY: mova-internal-dev-key-24
      DOCKER: 'true'
      PORT: 3000
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BJFvspWyBgYCoGpExw4DSt53TOajC27s5JK89xA_PuSQg07gLkUtdr5Kwc8ypSNKpy7hNfy0Hfb6EtMMCzYkpSA}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-GFRggspdPXQDjE-IqGb-KFOAy3joP4XDxR92iZbxWt4}
      VAPID_SUBJECT: mailto:contact@mova.cd
      PARTNER_SMS_ALERTS: 'true'
      MOCK_SMS: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  admin-service:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    ports:
      - '3006:3000'
    environment:
      JWT_SECRET: local_dev_jwt_secret_32chars_min_ok
      AUTH_SERVICE_URL: http://auth-service:3000
      RIDE_SERVICE_URL: http://ride-service:3000
      DRIVER_SERVICE_URL: http://driver-service:3000
      PAYMENT_SERVICE_URL: http://payment-service:3000
      INTERNAL_API_KEY: mova-internal-dev-key-24
      PORT: 3000
    depends_on:
      - auth-service
      - ride-service
      - driver-service
      - payment-service

  api-gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    ports:
      - '3000:3000'
    restart: unless-stopped
    environment:
      NODE_ENV: development
      JWT_SECRET: local_dev_jwt_secret_32chars_min_ok
      INTERNAL_API_KEY: mova-internal-dev-key-24
      AUTH_SERVICE_URL: http://auth-service:3000
      RIDE_SERVICE_URL: http://ride-service:3000
      PAYMENT_SERVICE_URL: http://payment-service:3000
      DRIVER_SERVICE_URL: http://driver-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
      ADMIN_SERVICE_URL: http://admin-service:3000
      PORT: 3000
      # Fast probes in CI/local — Render overrides these for cold starts.
      HEALTH_CHECK_TIMEOUT_MS: '3000'
      HEALTH_CHECK_RETRIES: '0'
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002,http://localhost:3007,http://localhost:3008
    depends_on:
      - auth-service
      - ride-service
      - payment-service
      - driver-service
      - notification-service
      - admin-service

volumes:
  redis_data:
  pg_data:
