site_name: SENGA — Documentation technique
site_description: Architecture, API et CI/CD de la plateforme SENGA RDC
repo_url: https://github.com/mova-rdc/mova
theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
nav:
  - Accueil: index.md
  - Manuel utilisateur:
    - Vue d'ensemble: user-manual/index.md
    - Passager: user-manual/passager.md
    - Chauffeur: user-manual/chauffeur.md
    - Admin: user-manual/admin.md
  - Scripts vidéo:
    - Vue d'ensemble: video-scripts/index.md
    - Passager mobile: video-scripts/passager-mobile.md
    - Chauffeur mobile: video-scripts/chauffeur-mobile.md
    - Passager web: video-scripts/passager-web.md
    - Restaurant: video-scripts/restaurant.md
    - Location: video-scripts/location.md
    - Admin: video-scripts/admin.md
  - Architecture: architecture.md
  - API: api.md
  - CI/CD: cicd.md
  - Déploiement: deployment.md
docs_dir: docs
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
