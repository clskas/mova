name: mova
description: MOVA — Plateforme de mobilité RDC
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.4+3
  webview_flutter: ^4.10.0
  socket_io_client: ^3.0.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^20.1.0
  flutter_foreground_task: ^9.2.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  golden_toolkit: ^0.15.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/movaicone.png
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: assets/icon/movaicone.png
  flavors:
    passenger:
      image_path: assets/icon/movaicone.png
      adaptive_icon_background: "#1A1A2E"
      adaptive_icon_foreground: assets/icon/movaicone.png
    driver:
      image_path: assets/icon/movaicone.png
      adaptive_icon_background: "#1A1A2E"
      adaptive_icon_foreground: assets/icon/movaicone.png

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/icon/
    - assets/services/
