<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SENGA — QR installation Play Store</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #111;
      background: #fff;
    }
    h1 { font-size: 1.25rem; margin-bottom: 1.5rem; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
    }
    figure { margin: 0; text-align: center; }
    img {
      width: 100%;
      max-width: 320px;
      height: auto;
      image-rendering: pixelated;
      border: 1px solid #ddd;
    }
    figcaption { margin-top: 0.75rem; }
    .label { font-weight: 700; font-size: 1.1rem; }
    .url {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.75rem;
      word-break: break-all;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>SENGA — QR codes Google Play</h1>
  <div class="grid">
    <figure>
      <img src="qr-senga-passenger-play.png" alt="QR SENGA Passager" width="768" height="768" />
      <figcaption>
        <span class="label">SENGA Passager</span>
        <a class="url" href="https://play.google.com/store/apps/details?id=cd.mova.mova.passenger">
          https://play.google.com/store/apps/details?id=cd.mova.mova.passenger
        </a>
      </figcaption>
    </figure>
    <figure>
      <img src="qr-senga-driver-play.png" alt="QR SENGA Chauffeur" width="768" height="768" />
      <figcaption>
        <span class="label">SENGA Chauffeur</span>
        <a class="url" href="https://play.google.com/store/apps/details?id=cd.mova.mova.driver">
          https://play.google.com/store/apps/details?id=cd.mova.mova.driver
        </a>
      </figcaption>
    </figure>
  </div>
</body>
</html>
