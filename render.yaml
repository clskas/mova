# Render Blueprint — SENGA RDC microservices
# https://render.com/docs/blueprint-spec

services:
  - type: keyvalue
    name: mova-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: mova-gateway
    runtime: docker
    dockerfilePath: ./docker/gateway.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health/live
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_SERVICE_URL
        fromService: { name: mova-auth, type: web, property: hostport }
      - key: RIDE_SERVICE_URL
        fromService: { name: mova-ride, type: web, property: hostport }
      - key: PAYMENT_SERVICE_URL
        fromService: { name: mova-payment, type: web, property: hostport }
      - key: DRIVER_SERVICE_URL
        fromService: { name: mova-driver, type: web, property: hostport }
      - key: NOTIFICATION_SERVICE_URL
        fromService: { name: mova-notification, type: web, property: hostport }
      - key: ADMIN_SERVICE_URL
        fromService: { name: mova-admin, type: web, property: hostport }
      - key: HEALTH_CHECK_TIMEOUT_MS
        value: "45000"
      - key: HEALTH_CHECK_RETRIES
        value: "2"
      # Browser portals call the public gateway origin. Explicit hosts only (no *.onrender.com wildcard).
      - key: CORS_ORIGIN
        value: "https://senga.afri-soft.com,https://admin.afri-soft.com,https://restaurant.afri-soft.com,https://rental.afri-soft.com,https://mova-web.onrender.com,https://mova-admin-web.onrender.com,https://mova-restaurant.onrender.com,https://mova-rental-partner.onrender.com,https://mova-admin.onrender.com"

  - type: web
    name: mova-auth
    runtime: docker
    dockerfilePath: ./docker/auth.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: mova-db-auth, property: connectionString }
      - key: REDIS_URL
        fromService: { name: mova-redis, type: keyvalue, property: connectionString }
      - key: JWT_SECRET
        fromService: { name: mova-gateway, type: web, envVarKey: JWT_SECRET }
      - key: MOCK_OTP
        value: "false"
      # Seed phones (+2439000000xx): 123456, no SMS. Real +243 receive SMS. ALLOW_TEST_OTP only adds extra TEST_OTP_PHONES.
      - key: ALLOW_TEST_OTP
        value: "true"
      - key: AFRISOFT_SMS_HUB_URL
        value: "https://sms.afri-soft.com"
      - key: AFRISOFT_HUB_APP_ID
        value: "senga"
      # Google Sign-In — set after creating OAuth clients (no value in repo).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      # Optional second Android OAuth client (SENGA Driver). Alternatively comma-separate both IDs in GOOGLE_ANDROID_CLIENT_ID.
      - key: GOOGLE_ANDROID_CLIENT_ID_DRIVER
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      # Email OTP for Google-only accounts (no +243). Resend or SMTP — do not skip OTP if unset.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - fromGroup: mova-external-apis

  - type: web
    name: mova-ride
    runtime: docker
    dockerfilePath: ./docker/ride.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: mova-db-rides, property: connectionString }
      - key: REDIS_URL
        fromService: { name: mova-redis, type: keyvalue, property: connectionString }
      - key: JWT_SECRET
        fromService: { name: mova-gateway, type: web, envVarKey: JWT_SECRET }
      - key: DRIVER_SERVICE_URL
        fromService: { name: mova-driver, type: web, property: hostport }
      - key: PAYMENT_SERVICE_URL
        fromService: { name: mova-payment, type: web, property: hostport }
      - key: AUTH_SERVICE_URL
        fromService: { name: mova-auth, type: web, property: hostport }
      - key: PAY_HUB_URL
        value: "https://pay.afri-soft.com"
      - fromGroup: mova-external-apis

  - type: web
    name: mova-payment
    runtime: docker
    dockerfilePath: ./docker/payment.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: mova-db-payments, property: connectionString }
      - key: REDIS_URL
        fromService: { name: mova-redis, type: keyvalue, property: connectionString }
      - key: JWT_SECRET
        fromService: { name: mova-gateway, type: web, envVarKey: JWT_SECRET }
      - key: RIDE_SERVICE_URL
        fromService: { name: mova-ride, type: web, property: hostport }
      - key: MOCK_PAYMENTS
        value: "false"
      - key: AFRISOFT_PAY_HUB_URL
        value: "https://pay.afri-soft.com"
      - key: AFRISOFT_PAY_HUB_APP_ID
        value: "senga"
      - fromGroup: mova-external-apis

  - type: web
    name: mova-driver
    runtime: docker
    dockerfilePath: ./docker/driver.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: mova-db-drivers, property: connectionString }
      - key: REDIS_URL
        fromService: { name: mova-redis, type: keyvalue, property: connectionString }
      - key: JWT_SECRET
        fromService: { name: mova-gateway, type: web, envVarKey: JWT_SECRET }
      - key: RIDE_SERVICE_URL
        fromService: { name: mova-ride, type: web, property: hostport }

  - type: web
    name: mova-notification
    runtime: docker
    dockerfilePath: ./docker/notification.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: mova-db-notifications, property: connectionString }
      - key: REDIS_URL
        fromService: { name: mova-redis, type: keyvalue, property: connectionString }
      - key: JWT_SECRET
        fromService: { name: mova-gateway, type: web, envVarKey: JWT_SECRET }
      - key: AFRISOFT_SMS_HUB_URL
        value: "https://sms.afri-soft.com"
      - key: AFRISOFT_HUB_APP_ID
        value: "senga"
      - fromGroup: mova-external-apis

  - type: web
    name: mova-admin
    runtime: docker
    dockerfilePath: ./docker/admin.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        fromService: { name: mova-gateway, type: web, envVarKey: JWT_SECRET }
      - key: AUTH_SERVICE_URL
        fromService: { name: mova-auth, type: web, property: hostport }
      - key: RIDE_SERVICE_URL
        fromService: { name: mova-ride, type: web, property: hostport }
      - key: DRIVER_SERVICE_URL
        fromService: { name: mova-driver, type: web, property: hostport }
      - key: INTERNAL_API_KEY
        generateValue: true

  - type: web
    name: mova-web
    runtime: docker
    dockerfilePath: ./docker/web.Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      # Origin only (no /api) — clients append /api/...
      - key: NEXT_PUBLIC_API_URL
        value: https://mova-gateway.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: mova-admin-web
    runtime: docker
    dockerfilePath: ./docker/admin-web.Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://mova-gateway.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: mova-restaurant
    runtime: docker
    dockerfilePath: ./docker/restaurant.Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://mova-gateway.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      # next.config.mjs also reads RENDER_GIT_COMMIT (injected by Render) as NEXT_PUBLIC_BUILD_ID.

  - type: web
    name: mova-rental-partner
    runtime: docker
    dockerfilePath: ./docker/rental-partner.Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://mova-gateway.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

databases:
  # Production Render : 5 Postgres managés (isolation facturation/plan).
  # Alternative documentée : un cluster Neon avec les mêmes databaseName — voir docs/MICROSERVICES_STRATEGY.md
  - name: mova-db-auth
    plan: starter
    databaseName: mova_auth
    user: mova
  - name: mova-db-rides
    plan: starter
    databaseName: mova_rides
    user: mova
  - name: mova-db-payments
    plan: starter
    databaseName: mova_payments
    user: mova
  - name: mova-db-drivers
    plan: starter
    databaseName: mova_drivers
    user: mova
  - name: mova-db-notifications
    plan: starter
    databaseName: mova_notifications
    user: mova

envVarGroups:
  - name: mova-external-apis
    envVars:
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: MAPBOX_STYLE_URL
        value: mapbox://styles/mova/midnight-violet
      # OTP SMS switch : africastalking | serdipay (docs/SMS_OTP_PROVIDERS.md). Sticky — no silent fallback.
      - key: SMS_PROVIDER
        value: africastalking
      - key: MOBILE_MONEY_GATEWAY
        value: serdipay
      # HMAC for pay.afri-soft.com + sms.afri-soft.com (same app_id:api_key as VPS AFRISOFT_HUB_APPS).
      - key: AFRISOFT_HUB_API_KEY
        sync: false
      - key: AFRISOFT_PAY_HUB_API_KEY
        sync: false
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: AFRICAS_TALKING_ENV
        value: production
      - key: AFRICAS_TALKING_SMS_SENDER
        value: MOVA
      - key: SERDIPAY_BASE_URL
        value: https://serdipay.com
      # Public API MM — live keys belong on VPS /opt/afrisoft-pay/.env (pay.afri-soft.com), not git.
      - key: SERDIPAY_EMAIL
        sync: false
      - key: SERDIPAY_PASSWORD
        sync: false
      - key: SERDIPAY_API_ID
        sync: false
      - key: SERDIPAY_API_PASSWORD
        sync: false
      - key: SERDIPAY_MERCHANT_CODE
        sync: false
      - key: SERDIPAY_MERCHANT_PIN
        sync: false
      # Legacy aliases: EMAIL/PASSWORD and MERCHANT_CODE
      - key: SERDIPAY_CLIENT_ID
        sync: false
      - key: SERDIPAY_CLIENT_SECRET
        sync: false
      - key: SERDIPAY_MERCHANT_ID
        sync: false
      - key: SERDIPAY_WEBHOOK_SECRET
        sync: false
      # SerdiPay SMS API (otp) — distinct from payment email/password / API_ID
      - key: SERDIPAY_SMS_BASE_URL
        value: https://serdipay.com
      - key: SERDIPAY_SMS_PATH
        value: /api/sms-api/v1/send
      - key: SERDIPAY_SMS_API_ID
        sync: false
      - key: SERDIPAY_SMS_API_KEY
        sync: false
      - key: SERDIPAY_SMS_SENDER_ID
        sync: false
      - key: SUPABASE_URL
        value: https://furttqrltkwirdhiktdl.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_UPLOADS_BUCKET
        value: uploads
      - key: SUPABASE_KYC_BUCKET
        value: kyc-docs
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: ORANGE_MONEY_API_KEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: AIRTEL_MONEY_CLIENT_ID
        sync: false
      - key: FCM_SERVER_KEY
        sync: false
      # In-app update banner (ride-service GET /api/public/app-version). Raise after Play upload.
      - key: MOBILE_PASSENGER_VERSION
        value: "1.0.3"
      - key: MOBILE_DRIVER_VERSION
        value: "1.0.3"
      - key: MOBILE_MIN_VERSION
        value: "1.0.0"
      # Raise after Play accepts a new AAB (must be ≥ 8). 0 = ignore versionCode.
      - key: MOBILE_PASSENGER_VERSION_CODE
        value: "28"
      - key: MOBILE_DRIVER_VERSION_CODE
        value: "28"
      - key: MOBILE_MIN_VERSION_CODE
        value: "0"
      - key: PLAY_STORE_PASSENGER_URL
        value: "https://play.google.com/store/apps/details?id=cd.mova.mova.passenger"
      - key: PLAY_STORE_DRIVER_URL
        value: "https://play.google.com/store/apps/details?id=cd.mova.mova.driver"
